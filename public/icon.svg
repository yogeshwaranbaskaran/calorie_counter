<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171c22"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fe3a0"/>
      <stop offset="1" stop-color="#4fb864"/>
    </linearGradient>
  </defs>
  <!-- rounded square, the same dark the app uses -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- the calorie ring: a track, and the filled arc at roughly three quarters -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#1f252d" stroke-width="40"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#g)" stroke-width="40"
          stroke-linecap="round" stroke-dasharray="706 942" transform="rotate(-90 256 256)"/>
  <!-- a fork, centred: long tines, a rounded neck, a long handle -->
  <g fill="none" stroke="#eef0f3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M222 158 v58 M256 158 v58 M290 158 v58" stroke-width="16"/>
    <path d="M222 200 v22 a34 34 0 0 0 68 0 v-22" stroke-width="16"/>
    <path d="M256 256 v104" stroke-width="20"/>
  </g>
</svg>
