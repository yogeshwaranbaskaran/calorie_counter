<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1012">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>health agent</title>
<style>
:root{
  --bg:#0e1012; --surface:#17191d; --line:#24272c; --text:#e8eaed;
  --muted:#8b9199; --accent:#7dd88f; --warn:#e0a35c; --danger:#e07a7a;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
header{
  display:flex; align-items:baseline; gap:10px; padding:14px 16px;
  border-bottom:1px solid var(--line); background:var(--bg);
  position:sticky; top:0; z-index:5;
}
header b{font-size:22px; font-variant-numeric:tabular-nums}
header .u{color:var(--muted); font-size:13px}
header .sp{margin-left:auto; color:var(--muted); font-size:13px}
main{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px}
.msg{max-width:88%; padding:10px 13px; border-radius:var(--radius); white-space:pre-wrap; word-wrap:break-word}
.me{align-self:flex-end; background:#243043; border-bottom-right-radius:4px}
.bot{align-self:flex-start; background:var(--surface); border-bottom-left-radius:4px}
.tools{align-self:flex-start; color:var(--muted); font-size:12px; font-family:ui-monospace,monospace}
.card{
  align-self:stretch; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); padding:14px;
}
.card h3{margin:0 0 10px; font-size:13px; color:var(--muted); font-weight:600; letter-spacing:.04em; text-transform:uppercase}
.row{display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-variant-numeric:tabular-nums}
.row span:last-child{color:var(--muted); white-space:nowrap}
.tot{border-top:1px solid var(--line); margin-top:8px; padding-top:10px; font-weight:600}
.acts{display:flex; gap:8px; margin-top:12px}
button{
  flex:1; padding:11px; border-radius:10px; border:1px solid var(--line);
  background:transparent; color:var(--text); font-size:15px; font-weight:600;
  cursor:pointer; font-family:inherit;
}
button.go{background:var(--accent); color:#0e1012; border-color:var(--accent)}
button:disabled{opacity:.45}
footer{padding:10px 12px; border-top:1px solid var(--line); display:flex; gap:8px; background:var(--bg)}
input{
  flex:1; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
  background:var(--surface); color:var(--text); font-size:16px; font-family:inherit;
}
input:focus{outline:none; border-color:var(--muted)}
.gate{margin:auto; text-align:center; padding:24px; max-width:300px}
.gate p{color:var(--muted); font-size:14px}
.err{color:var(--danger); font-size:13px}
</style>
</head>
<body>
<header>
  <b id="kcal">—</b><span class="u">kcal today</span>
  <span class="sp" id="protein"></span>
</header>
<main id="feed"></main>
<footer>
  <input id="say" placeholder="what did you eat?" autocomplete="off" enterkeyhint="send">
  <button id="send" style="flex:0 0 auto; padding:11px 18px">→</button>
</footer>

<script type="module">
const $ = (id) => document.getElementById(id)
const feed = $('feed')
let history = []
let pass = localStorage.getItem('passcode') || ''

const headers = () => ({ 'content-type': 'application/json', 'x-passcode': pass })

function bubble(cls, text) {
  const el = document.createElement('div')
  el.className = cls
  el.textContent = text
  feed.appendChild(el)
  feed.scrollTop = feed.scrollHeight
  return el
}

async function refreshDay() {
  try {
    const r = await fetch('/api/day', { headers: headers() })
    if (r.status === 401) return gate()
    const d = await r.json()
    $('kcal').textContent = d.totals.kcal || 0
    $('protein').textContent = d.totals.protein_g ? `${d.totals.protein_g}g protein` : ''
  } catch {}
}

function gate(message) {
  document.body.innerHTML = `<div class="gate"><h2>health agent</h2>
    <p>${message || 'enter the passcode'}</p>
    <input id="p" type="password" style="width:100%;margin:8px 0" enterkeyhint="go">
    <button class="go" id="ok" style="width:100%">unlock</button></div>`
  const go = () => { localStorage.setItem('passcode', $('p').value.trim()); location.reload() }
  $('ok').onclick = go
  $('p').onkeydown = (e) => e.key === 'Enter' && go()
  $('p').focus()
}

// The confirm gate, in the UI. Nothing is written until Confirm is pressed,
// and Confirm sends only names and quantities - the server recomputes totals.
function proposalCard(p) {
  const el = document.createElement('div')
  el.className = 'card'
  el.innerHTML =
    `<h3>${p.date}</h3>` +
    p.rows.map((r) =>
      `<div class="row"><span>${r.qty} × ${r.name}</span><span>${r.grams}g · ${r.kcal} kcal</span></div>`).join('') +
    `<div class="row tot"><span>total</span><span>${p.totals.kcal} kcal · ${p.totals.protein_g}g protein</span></div>` +
    `<div class="acts"><button id="no">cancel</button><button class="go" id="yes">log it</button></div>`
  feed.appendChild(el)
  feed.scrollTop = feed.scrollHeight

  el.querySelector('#no').onclick = () => {
    el.querySelector('.acts').remove()
    bubble('tools', 'not logged')
    history.push({ role: 'user', text: '(I cancelled that - do not log it)' })
  }
  el.querySelector('#yes').onclick = async () => {
    el.querySelectorAll('button').forEach((b) => (b.disabled = true))
    const items = p.rows.map((r) => ({ name: r.name, qty: r.qty }))
    const res = await fetch('/api/commit', {
      method: 'POST', headers: headers(), body: JSON.stringify({ date: p.date, items }),
    })
    const out = await res.json()
    el.querySelector('.acts').remove()
    if (out.written) {
      bubble('tools', `logged · ${out.totals.kcal} kcal`)
      history.push({ role: 'user', text: '(confirmed and logged)' })
      refreshDay()
    } else {
      bubble('err', out.error || 'could not save')
    }
  }
}

async function send() {
  const text = $('say').value.trim()
  if (!text) return
  $('say').value = ''
  bubble('msg me', text)
  history.push({ role: 'user', text })

  const thinking = bubble('tools', '…')
  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: headers(), body: JSON.stringify({ messages: history }),
    })
    if (res.status === 401) return gate('wrong passcode')
    const out = await res.json()
    thinking.remove()

    if (out.error) return bubble('err', out.error)
    history = out.history
    if (out.calls?.length) bubble('tools', out.calls.join(' → '))
    if (out.reply) bubble('msg bot', out.reply)
    if (out.proposal) proposalCard(out.proposal)
  } catch (e) {
    thinking.remove()
    bubble('err', 'network problem')
  }
}

$('send').onclick = send
$('say').onkeydown = (e) => e.key === 'Enter' && send()
refreshDay()
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {})
</script>
</body>
</html>
