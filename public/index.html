<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1012">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>health agent</title>
<style>
:root{
  --bg:#0e1012; --surface:#17191d; --raised:#1d2026; --line:#24272c; --text:#e8eaed;
  --muted:#8b9199; --faint:#5c626a; --accent:#7dd88f; --danger:#e07a7a;
  /* macro series - validated for this dark surface (CVD dE 9.4, normal 20.9) */
  --protein:#3987e5; --carbs:#d95926; --fat:#199e70;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
h1,h2,h3,h4{margin:0}
header{
  display:flex; align-items:baseline; gap:9px; padding:13px 16px;
  border-bottom:1px solid var(--line); background:var(--bg); flex:0 0 auto;
}
header b{font-size:23px; font-variant-numeric:tabular-nums; line-height:1}
header .u{color:var(--muted); font-size:13px}
header .sp{margin-left:auto; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums}
#daybar{
  display:flex; align-items:center; gap:8px; padding:8px 16px; flex:0 0 auto;
  border-bottom:1px solid var(--line); background:var(--bg);
}
#daybar button{
  background:none; border:1px solid var(--line); color:var(--text); cursor:pointer;
  border-radius:8px; width:30px; height:30px; font-size:17px; line-height:1; padding:0;
}
#daybar button:disabled{opacity:.3; cursor:default}
#daybar input[type=date]{
  flex:0 1 auto; width:auto; padding:5px 9px; font-size:14px; border-radius:8px;
  border:1px solid var(--line); background:var(--surface); color:var(--text);
  font-family:inherit; color-scheme:dark;
}
#daytag{font-size:12px; color:var(--faint); margin-left:auto}
#daybar.past input[type=date]{border-color:var(--accent); color:var(--accent)}
#daybar.past #daytag{color:var(--accent)}
main{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px; min-height:0}

.sect{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px}
.sect > h3, .lbl{
  font-size:11px; color:var(--faint); font-weight:600;
  letter-spacing:.06em; text-transform:uppercase; margin-bottom:10px;
}
.hint{color:var(--muted); font-size:13.5px; margin:0}

/* ---------- empty / intro ---------- */
.intro{margin:auto 0; padding:8px 2px}
.intro h1{font-size:19px; margin-bottom:6px; font-weight:600}
.intro p{margin:0 0 18px; color:var(--muted); font-size:14px; max-width:34ch}
.eg{
  display:block; width:100%; text-align:left; margin-bottom:7px; padding:11px 13px;
  background:var(--surface); border:1px solid var(--line); border-radius:11px;
  color:var(--text); font:inherit; cursor:pointer;
}
.eg:active{border-color:var(--muted)}

/* ---------- entries ---------- */
.ent{display:flex; align-items:center; gap:10px; padding:7px 2px; font-variant-numeric:tabular-nums}
.ent .n{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ent .k{color:var(--muted); font-size:13px}
.ent .x{background:none; border:0; color:var(--faint); font-size:17px; line-height:1; padding:2px 5px; cursor:pointer}
.ent .x:active{color:var(--danger)}

/* ---------- chat ---------- */
.msg{max-width:88%; padding:10px 13px; border-radius:var(--radius); white-space:pre-wrap; word-wrap:break-word}
.me{align-self:flex-end; background:#243043; border-bottom-right-radius:4px}
.bot{align-self:flex-start; background:var(--surface); border-bottom-left-radius:4px}
.tools{align-self:flex-start; color:var(--faint); font-size:12px; font-family:ui-monospace,monospace}
.err{align-self:flex-start; color:var(--danger); font-size:13px}

/* ---------- editable proposal ---------- */
.prow{padding:9px 0; border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
/* Name on its own line: at 390px there is no room for a name plus two inputs
   plus a total, and truncating the food to "cream..." defeats the review. */
.prow .pn{display:block; margin-bottom:6px; font-size:14.5px}
.prow .pctl{display:flex; align-items:center; gap:6px}
.prow input{
  width:62px; flex:0 0 auto; padding:6px 8px; font-size:15px; text-align:right;
  border-radius:8px; border:1px solid var(--line); background:var(--raised);
  color:var(--text); font-family:inherit; font-variant-numeric:tabular-nums;
}
.prow input:focus{outline:none; border-color:var(--accent)}
.prow .unit{color:var(--faint); font-size:11.5px; flex:0 0 auto}
.prow .sub{color:var(--text); font-size:13.5px; margin-left:auto; flex:0 0 auto;
  font-variant-numeric:tabular-nums}
.prow .drop{background:none; border:0; color:var(--faint); font-size:18px; cursor:pointer;
  padding:2px 2px 2px 8px; flex:0 0 auto}
.prow .drop:active{color:var(--danger)}
.edited{color:var(--accent); font-size:12px; margin-top:9px}

/* ---------- proposal ---------- */
.row{display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-variant-numeric:tabular-nums}
.row span:last-child{color:var(--muted); white-space:nowrap; font-size:13px}
.tot{border-top:1px solid var(--line); margin-top:8px; padding-top:10px; font-weight:600}
.tot span:last-child{color:var(--text)}
.acts{display:flex; gap:8px; margin-top:13px}
button.b{
  flex:1; padding:11px; border-radius:10px; border:1px solid var(--line);
  background:transparent; color:var(--text); font-size:15px; font-weight:600; cursor:pointer; font-family:inherit;
}
button.go{background:var(--accent); color:#0e1012; border-color:var(--accent)}
button.b:disabled{opacity:.4}

/* ---------- charts ---------- */
svg{display:block; width:100%; height:auto; overflow:visible}
.bar{cursor:pointer}
.bar rect.hit{fill:transparent}
.axis{font-size:10px; fill:var(--faint)}
.axis.on{fill:var(--text)}
.vlabel{font-size:10.5px; fill:var(--muted); font-variant-numeric:tabular-nums}
.gridline{stroke:var(--line); stroke-width:1}
.avgline{stroke:var(--faint); stroke-width:1; stroke-dasharray:3 3}

.legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:11px}
.legend div{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted)}
.legend i{width:9px; height:9px; border-radius:2px; display:block}

.stack{display:flex; gap:2px; height:26px; border-radius:5px; overflow:hidden; margin-top:2px}
.stack span{display:block}

.hero{display:flex; gap:22px; flex-wrap:wrap}
.hero div{min-width:74px}
.hero b{display:block; font-size:24px; font-variant-numeric:tabular-nums; line-height:1.2}
.hero small{color:var(--faint); font-size:11.5px; text-transform:uppercase; letter-spacing:.05em}

.frow{display:flex; align-items:center; gap:10px; padding:5px 0; font-size:14px}
.frow .fn{width:38%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.frow .fb{flex:1; height:8px; background:var(--raised); border-radius:4px; overflow:hidden}
.frow .fb i{display:block; height:100%; background:var(--accent); border-radius:4px}
.frow .fc{color:var(--muted); font-size:12.5px; font-variant-numeric:tabular-nums; width:52px; text-align:right}

/* ---------- macro panel ---------- */
.mrow{display:flex; align-items:center; gap:10px; padding:6px 0; font-size:13.5px}
.mrow .ml{width:58px; color:var(--muted); flex:0 0 auto}
.mrow .mt{flex:1; height:9px; background:var(--raised); border-radius:5px; position:relative; overflow:hidden}
.mrow .mt i{display:block; height:100%; border-radius:5px}
.mrow .mt u{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--faint); text-decoration:none}
.mrow .mv{width:76px; text-align:right; flex:0 0 auto; font-variant-numeric:tabular-nums}
.mrow .mv small{color:var(--faint); font-size:11px}

.bignum{display:flex; align-items:baseline; gap:9px; margin-bottom:4px}
.bignum b{font-size:34px; line-height:1; font-variant-numeric:tabular-nums}
.bignum span{color:var(--muted); font-size:13px}
.bignum .delta{margin-left:auto; font-size:12px; color:var(--faint)}

/* ---------- metric switcher ---------- */
.pills{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
.pills button{
  background:var(--raised); border:1px solid var(--line); color:var(--muted);
  border-radius:999px; padding:5px 11px; font:inherit; font-size:12.5px; cursor:pointer;
}
.pills button.on{background:var(--accent); border-color:var(--accent); color:#0e1012; font-weight:600}

/* ---------- small multiples ---------- */
.sm{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.sm figure{margin:0}
.sm figcaption{font-size:11.5px; color:var(--muted); margin-bottom:3px; display:flex; justify-content:space-between}
.sm figcaption b{color:var(--text); font-weight:600; font-variant-numeric:tabular-nums}

/* ---------- insight cards ---------- */
.ins{border-left:3px solid var(--line); padding:2px 0 2px 12px; margin-bottom:14px}
.ins.up{border-color:var(--fat)}
.ins.down{border-color:var(--carbs)}
.ins.note{border-color:var(--faint)}
.ins h4{font-size:11px; color:var(--faint); font-weight:600; letter-spacing:.06em; text-transform:uppercase; margin-bottom:3px}
.ins p{margin:0; font-size:14.5px}

/* ---------- chrome ---------- */
footer{padding:10px 12px; border-top:1px solid var(--line); display:flex; gap:8px; background:var(--bg); flex:0 0 auto}
input{
  flex:1; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
  background:var(--surface); color:var(--text); font-size:16px; font-family:inherit;
}
input::placeholder{color:var(--faint)}
input:focus{outline:none; border-color:var(--muted)}
#send{flex:0 0 auto; padding:11px 17px; font-size:17px}
nav{
  display:flex; border-top:1px solid var(--line); background:var(--bg); flex:0 0 auto;
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1; padding:11px 4px 12px; background:none; border:0; cursor:pointer;
  color:var(--faint); font:inherit; font-size:12px; border-top:2px solid transparent; margin-top:-1px;
}
nav button.on{color:var(--text); border-top-color:var(--accent)}
.gate{margin:auto; text-align:center; padding:24px; max-width:300px}
</style>
</head>
<body>
<header>
  <b id="kcal">0</b><span class="u">kcal today</span>
  <span class="sp" id="protein"></span>
</header>

<div id="daybar">
  <button id="prev" title="previous day">‹</button>
  <input type="date" id="picker">
  <button id="next" title="next day">›</button>
  <span id="daytag"></span>
</div>

<main id="view"></main>

<footer id="bar">
  <input id="say" placeholder="what did you eat?" autocomplete="off" enterkeyhint="send">
  <button class="b" id="send">→</button>
</footer>

<nav>
  <button data-tab="log" class="on">Log</button>
  <button data-tab="week">Week</button>
  <button data-tab="stats">Stats</button>
  <button data-tab="insights">Insights</button>
</nav>

<script type="module">
const $ = (id) => document.getElementById(id)
const view = $('view')
let tab = 'log'
let history = []
let chat = []            // rendered chat nodes, kept across tab switches
let pass = localStorage.getItem('passcode') || ''

// The selected day drives BOTH what you are looking at and what a new entry is
// logged into, so backfilling old days needs no special mode.
const isoToday = () => {
  const d = new Date(), p = (n) => String(n).padStart(2, '0')
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`
}
const shiftIso = (iso, by) => {
  const [y, m, d] = iso.split('-').map(Number)
  const t = new Date(y, m - 1, d + by), p = (n) => String(n).padStart(2, '0')
  return `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}`
}
let logDate = isoToday()

const headers = () => ({ 'content-type': 'application/json', 'x-passcode': pass })
const esc = (s) => String(s).replace(/[<>&"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]))
// "250 x rice" reads as 250 servings. A weight belongs against its unit.
// Display only. Stored names stay lowercase so lookups keep matching - this
// capitalises the first letter at render time, not in the table.
const cap = (t) => { const x = String(t); return x.charAt(0).toUpperCase() + x.slice(1) }
const qtyLabel = (qty, unit) =>
  ['g', 'ml'].includes(String(unit).toLowerCase()) ? `${qty}${unit}` : `${qty} ×`
const el = (cls, html) => { const d = document.createElement('div'); d.className = cls; if (html != null) d.innerHTML = html; return d }
const api = async (path, opts) => {
  const r = await fetch(path, { headers: headers(), ...opts })
  if (r.status === 401) { gate('wrong passcode'); throw new Error('unauthorized') }
  return r.json()
}

/* ============================================================ LOG ======= */

const EXAMPLES = ['2 dosa and sambar', 'a bowl of curd rice', '2 eggs and 2 chapati']

function bubble(cls, text) {
  const d = el(cls); d.textContent = text
  chat.push(d)
  if (tab === 'log') { view.appendChild(d); view.scrollTop = view.scrollHeight }
  return d
}

function intro() {
  const box = el('intro', `
    <h1>What did you eat?</h1>
    <p>Type it however you'd say it. I work out the calories, you confirm, it's logged.</p>
    <div class="lbl">try</div>` + EXAMPLES.map((e) => `<button class="eg">${esc(e)}</button>`).join(''))
  box.querySelectorAll('.eg').forEach((b) => (b.onclick = () => { $('say').value = b.textContent; send() }))
  return box
}

function todayPanel(rows) {
  const box = el('sect', `<h3>what you ate</h3>` + (rows.length ? rows.map((r) => `
    <div class="ent" data-id="${r.id}">
      <span class="n">${qtyLabel(r.qty, r.unit)} ${esc(cap(r.name))}</span>
      <span class="k">${r.kcal} kcal</span>
      <button class="x" title="remove">×</button>
    </div>`).join('') : '<p class="hint">Nothing logged yet today.</p>'))
  box.querySelectorAll('.ent').forEach((row) => {
    row.querySelector('.x').onclick = async () => {
      row.style.opacity = .4
      const out = await api(`/api/entry?id=${row.dataset.id}`, { method: 'DELETE' })
      out.deleted ? render() : (row.style.opacity = 1)
    }
  })
  return box
}

// The confirm gate. Nothing is written until "log it"; it sends only names and
// quantities, and the server recomputes every number from the food table.
function proposalCard(p) {
  // The review card is EDITABLE. Getting a quantity or a calorie wrong is the
  // normal case, and re-explaining it in chat to fix a number is absurd.
  // Everything recomputes locally as you type; the server recomputes again on
  // commit, so the numbers are still not trusted from the client.
  const rows = p.rows.map((r) => ({ ...r }))

  const box = el('sect', `<h3>${p.date}</h3>
    <div class="plist"></div>
    <div class="row tot"><span>total</span><span class="grand"></span></div>
    <div class="edited" hidden></div>
    <div class="acts"><button class="b" data-a="no">cancel</button><button class="b go" data-a="yes">log it</button></div>`)

  const list = box.querySelector('.plist')
  const grand = box.querySelector('.grand')
  const editedNote = box.querySelector('.edited')

  const paint = () => {
    const live = rows.filter((r) => !r.dropped)
    const kcal = live.reduce((t, r) => t + Math.round(r.kcal_per_unit * r.qty / (r.basis || 1)), 0)
    // Protein per unit, scaled by any calorie correction - the same
    // proportional rule the server applies when it stores the edit.
    const protein = Math.round(live.reduce((t, r) => {
      const ratio = r.orig_kcal ? r.kcal_per_unit / r.orig_kcal : 1
      return t + r.protein_per_unit * ratio * r.qty / (r.basis || 1)
    }, 0) * 10) / 10
    grand.textContent = `${kcal} kcal · ${protein}g protein`
    box.querySelector('[data-a=yes]').disabled = live.length === 0

    const changed = rows.filter((r) => !r.dropped && Math.abs(r.kcal_per_unit - r.orig_kcal) >= 0.5)
    editedNote.hidden = !changed.length
    if (changed.length) {
      editedNote.textContent =
        `saves the corrected value for ${changed.map((r) => r.name).join(', ')}`
    }
  }

  rows.forEach((r, i) => {
    r.orig_kcal = r.kcal_per_unit
    r.protein_per_unit = r.qty ? (r.protein_g * (r.basis || 1)) / r.qty : 0
    const line = el('prow', `
      <span class="pn">${esc(cap(r.name))}</span>
      <div class="pctl">
        <input class="q" type="number" inputmode="decimal" min="0" step="0.5" value="${r.qty}">
        <span class="unit">${esc(r.basis > 1 ? r.unit : '× ' + r.unit)}</span>
        <input class="k" type="number" inputmode="numeric" min="0" step="5" value="${Math.round(r.kcal_per_unit)}">
        <span class="unit">kcal${r.basis > 1 ? '/100' + esc(r.unit) : ' each'}</span>
        <span class="sub"></span>
        <button class="drop" title="remove">×</button>
      </div>`)

    const sub = line.querySelector('.sub')
    const redraw = () => {
      sub.textContent = `${Math.round(r.kcal_per_unit * r.qty / (r.basis || 1))} kcal`
      paint()
    }

    line.querySelector('.q').addEventListener('input', (e) => {
      const v = parseFloat(e.target.value)
      r.qty = Number.isFinite(v) && v >= 0 ? v : 0
      redraw()
    })
    line.querySelector('.k').addEventListener('input', (e) => {
      const v = parseFloat(e.target.value)
      r.kcal_per_unit = Number.isFinite(v) && v >= 0 ? v : 0
      redraw()
    })
    line.querySelector('.drop').onclick = () => {
      r.dropped = true
      line.remove()
      paint()
    }
    list.appendChild(line)
    redraw()
  })
  paint()

  box.querySelector('[data-a=no]').onclick = () => {
    box.querySelector('.acts').remove()
    bubble('tools', 'not logged')
    history.push({ role: 'user', text: '(I cancelled that - do not log it)' })
  }

  box.querySelector('[data-a=yes]').onclick = async () => {
    box.querySelectorAll('button').forEach((b) => (b.disabled = true))
    const items = rows.filter((r) => !r.dropped && r.qty > 0)
      .map((r) => ({ name: r.name, qty: r.qty, kcal_per_unit: r.kcal_per_unit }))
    const out = await api('/api/commit', { method: 'POST', body: JSON.stringify({ date: p.date, items }) })
    box.querySelector('.acts')?.remove()
    if (out.written) {
      bubble('tools', `logged · ${out.totals.kcal} kcal`)
      // Tell the model what was actually logged, so it does not repeat the
      // mistake later in the same conversation.
      const edits = (out.corrected ?? []).map((c) => `${c.name} is ${c.to} kcal each, not ${c.from}`)
      history.push({ role: 'user', text:
        `(I corrected and logged: ${items.map((i) => `${i.qty} x ${i.name}`).join(', ')}` +
        (edits.length ? `. Remember: ${edits.join('; ')}` : '') + ')' })
      if (edits.length) bubble('tools', `learned · ${edits.join('; ')}`)
      cache.range = null
      render()
    } else bubble('err', out.error || 'could not save')
  }

  chat.push(box)
  if (tab === 'log') { view.appendChild(box); view.scrollTop = view.scrollHeight }
}

async function send() {
  const text = $('say').value.trim()
  if (!text) return
  $('say').value = ''
  if (tab !== 'log') switchTab('log')
  view.querySelector('.intro')?.remove()
  bubble('msg me', text)
  history.push({ role: 'user', text })

  const thinking = bubble('tools', '…')
  try {
    const res = await fetch('/api/chat', { method: 'POST', headers: headers(), body: JSON.stringify({ messages: history, date: logDate }) })
    if (res.status === 401) return gate('wrong passcode')
    const out = await res.json()
    thinking.remove(); chat.splice(chat.indexOf(thinking), 1)

    // A rate-limited turn can still carry a finished proposal - show it, so a
    // 429 never costs you the meal you just typed.
    if (out.history) history = out.history
    if (out.error) {
      bubble('err', out.error)
      if (out.proposal) proposalCard(out.proposal)
      return
    }
    if (out.calls?.length) bubble('tools', out.calls.join(' → '))
    if (out.reply) bubble('msg bot', out.reply)
    if (out.proposal) proposalCard(out.proposal)
  } catch {
    thinking.remove(); chat.splice(chat.indexOf(thinking), 1)
    bubble('err', 'network problem')
  }
}

/* =========================================================== CHARTS ===== */

// Protein and carbs are 4 kcal/g, fat 9, so a macro's share of energy is a
// different story from its weight in grams - the panel shows both.
const MACROS = [
  { k: 'protein_g', label: 'protein', v: 'protein', kcalPerG: 4 },
  { k: 'carbs_g',   label: 'carbs',   v: 'carbs',   kcalPerG: 4 },
  { k: 'fat_g',     label: 'fat',     v: 'fat',     kcalPerG: 9 },
  { k: 'sugar_g',   label: 'sugar',   v: 'carbs',   kcalPerG: 4, sub: true },
]

// Bars are scaled against your own running average, so "a lot" means a lot
// FOR YOU - no invented daily targets, which would need an onboarding flow and
// would be a guess anyway.
function macroPanel(totals, avg) {
  const energy = MACROS.filter((m) => !m.sub)
    .reduce((t, m) => t + (totals[m.k] || 0) * m.kcalPerG, 0)

  return MACROS.map((m) => {
    const g = totals[m.k] || 0
    const ref = avg?.[m.k] || 0
    const top = Math.max(g, ref) * 1.25 || 1
    const pct = energy && !m.sub ? Math.round((g * m.kcalPerG / energy) * 100) : null
    return `<div class="mrow">
      <span class="ml">${m.label}</span>
      <span class="mt">
        <i style="width:${Math.min(100, g / top * 100)}%;background:var(--${m.v});${m.sub ? 'opacity:.55' : ''}"></i>
        ${ref ? `<u style="left:${Math.min(99, ref / top * 100)}%" title="your average ${ref}g"></u>` : ''}
      </span>
      <span class="mv">${Math.round(g)}g${pct !== null ? ` <small>${pct}%</small>` : ''}</span>
    </div>`
  }).join('')
}

const DOW = ['S', 'M', 'T', 'W', 'T', 'F', 'S']
const DAYS_FULL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday']
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
const asDate = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d) }
const dayName = (iso) => DAYS_FULL[asDate(iso).getDay()]
// "Wednesday, 8 Sep" beats "2026-09-08" for a log you scroll through by feel.
const prettyDate = (iso) => {
  const d = asDate(iso)
  const rel = iso === isoToday() ? 'Today' : iso === shiftIso(isoToday(), -1) ? 'Yesterday' : null
  const base = `${dayName(iso)}, ${d.getDate()} ${MONTHS[d.getMonth()]}`
  return rel ? `${rel} · ${base}` : base
}
const dowOf = (iso) => { const [y, m, d] = iso.split('-').map(Number); return DOW[new Date(y, m - 1, d).getDay()] }
const dayNum = (iso) => Number(iso.slice(8))

// Vertical bars, one series, so no legend - the section title names it.
// Tapping a bar selects that day rather than relying on hover, which does not
// exist on a phone.
function weekChart(days, avg, metric, picked, color) {
  const W = 320, H = 150, PAD_B = 22, PAD_T = 14
  const max = Math.max(...days.map((d) => d[metric] || 0), avg, 1)
  const scale = (v) => (H - PAD_B - PAD_T) * (v / max)
  const bw = W / days.length
  const inner = bw - 6 // 2px+ of surface between adjacent bars

  const bars = days.map((d, i) => {
    const value = d[metric] || 0
    const h = scale(value)
    const x = i * bw + 3
    const y = H - PAD_B - h
    const on = d.date === picked
    return `<g class="bar" data-date="${d.date}">
      <rect class="hit" x="${i * bw}" y="0" width="${bw}" height="${H}"></rect>
      ${value ? `<rect x="${x}" y="${y}" width="${inner}" height="${h}" rx="4"
          fill="${on ? 'var(--accent)' : color}"></rect>`
        : `<rect x="${x}" y="${H - PAD_B - 3}" width="${inner}" height="3" rx="1.5" fill="var(--line)"></rect>`}
      <text class="axis ${on ? 'on' : ''}" x="${x + inner / 2}" y="${H - 8}" text-anchor="middle">${dowOf(d.date)}</text>
      ${on && value ? `<text class="vlabel" x="${x + inner / 2}" y="${y - 5}" text-anchor="middle">${Math.round(value)}</text>` : ''}
    </g>`
  }).join('')

  const ay = H - PAD_B - scale(avg)
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories per day">
    <line class="gridline" x1="0" y1="${H - PAD_B}" x2="${W}" y2="${H - PAD_B}"></line>
    ${avg ? `<line class="avgline" x1="0" y1="${ay}" x2="${W}" y2="${ay}"></line>` : ''}
    ${bars}
  </svg>`
}

// Macros as a share of energy: protein and carbs 4 kcal/g, fat 9.
function macroStack(t) {
  const parts = [
    { k: 'protein', label: 'protein', kcal: (t.protein_g || 0) * 4, v: t.protein_g },
    { k: 'carbs', label: 'carbs', kcal: (t.carbs_g || 0) * 4, v: t.carbs_g },
    { k: 'fat', label: 'fat', kcal: (t.fat_g || 0) * 9, v: t.fat_g },
  ]
  const sum = parts.reduce((a, p) => a + p.kcal, 0)
  if (!sum) return '<p class="hint">No macros recorded yet.</p>'
  return `<div class="stack">` +
    parts.map((p) => `<span style="flex:${p.kcal};background:var(--${p.k})"></span>`).join('') +
    `</div><div class="legend">` +
    parts.map((p) => `<div><i style="background:var(--${p.k})"></i>${p.label} ${p.v}g · ${Math.round(p.kcal / sum * 100)}%</div>`).join('') +
    `</div>`
}

/* ============================================================ VIEWS ===== */

const cache = { day: null, range: null, insights: null }
let pickedDay = null

async function loadDay() { return (cache.day ??= await api(`/api/day?date=${logDate}`)) }
async function loadRange(days = 7) {
  if (cache.range?.n !== days) cache.range = { n: days, p: api(`/api/range?days=${days}`) }
  return cache.range.p
}

async function viewLog() {
  const d = await loadDay()
  view.innerHTML = ''

  if (d.rows.length) {
    // Averages are loaded lazily so the log stays instant; the reference marks
    // appear a moment later rather than blocking the screen.
    const card = el('sect', `<h3>${prettyDate(logDate)}</h3>
      <div class="bignum"><b>${d.totals.kcal}</b><span>kcal</span>
        <span class="delta" id="vsavg"></span></div>
      <div id="macros">${macroPanel(d.totals, null)}</div>`)
    view.appendChild(card)
    loadRange(30).then((r) => {
      if (!r?.daysLogged || !card.isConnected) return
      card.querySelector('#macros').innerHTML = macroPanel(d.totals, r.averages)
      const diff = d.totals.kcal - r.averages.kcal
      card.querySelector('#vsavg').textContent =
        `${diff >= 0 ? '+' : ''}${Math.round(diff)} vs your average`
    }).catch(() => {})
  }
  // An empty "today" card above the intro is just clutter on first open - show
  // one or the other, never both.
  if (d.rows.length) view.appendChild(todayPanel(d.rows))
  else if (!chat.length) view.appendChild(intro())
  chat.forEach((n) => view.appendChild(n))
  view.scrollTop = view.scrollHeight
}

const METRICS = [
  { key: 'kcal', label: 'calories', unit: 'kcal', color: 'var(--fat)' },
  { key: 'protein_g', label: 'protein', unit: 'g', color: 'var(--protein)' },
  { key: 'carbs_g', label: 'carbs', unit: 'g', color: 'var(--carbs)' },
  { key: 'fat_g', label: 'fat', unit: 'g', color: 'var(--fat)' },
  { key: 'sugar_g', label: 'sugar', unit: 'g', color: 'var(--carbs)' },
]
let weekMetric = 'kcal'
let weekSpan = 7

async function viewWeek() {
  const r = await loadRange(weekSpan)
  view.innerHTML = ''

  const spans = el('sect', `<h3>window</h3><div class="pills">` +
    [7, 14, 30].map((n) => `<button data-n="${n}" class="${n === weekSpan ? 'on' : ''}">${n} days</button>`).join('') +
    `</div>`)
  spans.querySelectorAll('button').forEach((b) => (b.onclick = () => {
    weekSpan = Number(b.dataset.n); pickedDay = null; viewWeek()
  }))
  view.appendChild(spans)

  if (!r.daysLogged) {
    return view.appendChild(el('sect', `<h3>last ${weekSpan} days</h3><p class="hint">Nothing logged yet in this window.</p>`))
  }

  const m = METRICS.find((x) => x.key === weekMetric)
  const avg = r.averages[m.key] || 0
  pickedDay ??= r.days.filter((d) => d.items.length).at(-1)?.date ?? r.days.at(-1).date

  // One metric at a time: two measures on one plot would need two scales, and
  // a dual axis is the fastest way to make a chart lie.
  const chart = el('sect', `<h3>${m.label} · last ${weekSpan} days · avg ${Math.round(avg)}${m.unit} (dashed)</h3>
    <div class="pills">` +
    METRICS.map((x) => `<button data-k="${x.key}" class="${x.key === weekMetric ? 'on' : ''}">${x.label}</button>`).join('') +
    `</div>${weekChart(r.days, avg, m.key, pickedDay, m.color)}`)
  chart.querySelectorAll('.pills button').forEach((b) => (b.onclick = () => { weekMetric = b.dataset.k; viewWeek() }))
  chart.querySelectorAll('.bar').forEach((g) => (g.onclick = () => { pickedDay = g.dataset.date; viewWeek() }))
  view.appendChild(chart)

  const sel = r.days.find((d) => d.date === pickedDay) ?? r.days.at(-1)
  view.appendChild(el('sect',
    `<h3>${prettyDate(sel.date)}</h3>` +
    (sel.items.length
      ? `<div class="bignum"><b>${sel.kcal}</b><span>kcal</span></div>` +
        macroPanel(sel, r.averages) +
        `<div style="margin-top:12px">` +
        sel.items.map((i) => `<div class="ent"><span class="n">${qtyLabel(i.qty, i.unit)} ${esc(cap(i.name))}</span><span class="k">${i.kcal} kcal</span></div>`).join('') +
        `</div>`
      : '<p class="hint">Nothing logged this day.</p>')))
}

// A sparkline per macro: four small multiples sharing a form but each on its
// own scale, which is the honest alternative to stacking different units on
// one axis.
function spark(days, key, color) {
  const W = 150, H = 40
  const vals = days.map((d) => d[key] || 0)
  const max = Math.max(...vals, 1)
  const bw = W / days.length
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${key} per day">
    ${vals.map((v, i) => {
      const h = v / max * (H - 4)
      return `<rect x="${i * bw + 0.8}" y="${H - h}" width="${Math.max(1.4, bw - 1.6)}" height="${h || 1}"
        rx="1.4" fill="${v ? color : 'var(--line)'}"></rect>`
    }).join('')}
  </svg>`
}

let statsSpan = 30

async function viewStats() {
  const r = await loadRange(statsSpan)
  view.innerHTML = ''

  const spans = el('sect', `<h3>window</h3><div class="pills">` +
    [7, 14, 30, 90].map((n) => `<button data-n="${n}" class="${n === statsSpan ? 'on' : ''}">${n} days</button>`).join('') +
    `</div>`)
  spans.querySelectorAll('button').forEach((b) => (b.onclick = () => { statsSpan = Number(b.dataset.n); viewStats() }))
  view.appendChild(spans)

  if (!r.daysLogged) return view.appendChild(el('sect', '<h3>stats</h3><p class="hint">Nothing to summarise yet.</p>'))

  const a = r.averages
  const logged = r.days.filter((d) => d.items.length)
  const kcals = logged.map((d) => d.kcal)
  const hi = logged.reduce((m, d) => (d.kcal > m.kcal ? d : m), logged[0])
  const lo = logged.reduce((m, d) => (d.kcal < m.kcal ? d : m), logged[0])

  view.appendChild(el('sect', `<h3>daily average · ${r.daysLogged} of ${r.days.length} days logged</h3>
    <div class="bignum"><b>${a.kcal}</b><span>kcal a day</span></div>
    ${macroPanel(a, null)}`))

  view.appendChild(el('sect', `<h3>where the energy comes from</h3>${macroStack(a)}`))

  view.appendChild(el('sect', `<h3>each macro, day by day</h3>
    <div class="sm">` +
    [['protein_g', 'protein', 'var(--protein)'], ['carbs_g', 'carbs', 'var(--carbs)'],
     ['fat_g', 'fat', 'var(--fat)'], ['sugar_g', 'sugar', 'var(--carbs)']]
      .map(([k, label, c]) => `<figure>
        <figcaption><span>${label}</span><b>${a[k]}g avg</b></figcaption>
        ${spark(r.days, k, c)}
      </figure>`).join('') +
    `</div>`))

  view.appendChild(el('sect', `<h3>spread</h3>
    <div class="row"><span>highest day</span><span>${dayName(hi.date)} ${hi.date.slice(8)} ${MONTHS[asDate(hi.date).getMonth()]} · ${hi.kcal} kcal</span></div>
    <div class="row"><span>lowest day</span><span>${dayName(lo.date)} ${lo.date.slice(8)} ${MONTHS[asDate(lo.date).getMonth()]} · ${lo.kcal} kcal</span></div>
    <div class="row"><span>range</span><span>${Math.max(...kcals) - Math.min(...kcals)} kcal</span></div>
    <div class="row"><span>days over average</span><span>${kcals.filter((k) => k > a.kcal).length} of ${kcals.length}</span></div>`))

  const max = Math.max(...r.topFoods.map((f) => f.times), 1)
  view.appendChild(el('sect', `<h3>most eaten · last ${statsSpan} days</h3>` +
    r.topFoods.map((f) => `<div class="frow">
      <span class="fn">${esc(cap(f.name))}</span>
      <span class="fb"><i style="width:${f.times / max * 100}%"></i></span>
      <span class="fc">${f.times}×</span>
    </div>`).join('')))
}

async function viewInsights() {
  view.innerHTML = ''
  const box = el('sect', `<h3>insights · last 14 days</h3>
    <p class="hint">A separate pass over your history. It reads the whole log at once and tells you what to change.</p>
    <div class="acts"><button class="b go" id="gen">read my log</button></div>`)
  view.appendChild(box)

  if (cache.insights) return paintInsights(cache.insights)
  box.querySelector('#gen').onclick = async () => {
    const btn = box.querySelector('#gen')
    btn.disabled = true; btn.textContent = 'reading…'
    try {
      const out = await api('/api/insights?days=14')
      cache.insights = out
      paintInsights(out)
    } catch {
      btn.disabled = false; btn.textContent = 'read my log'
    }
  }
}

function paintInsights(out) {
  view.querySelector('.acts')?.remove()
  if (out.empty || out.error) return view.appendChild(el('sect', `<p class="hint">${esc(out.message || out.error)}</p>`))
  view.appendChild(el('sect',
    `<div class="ins"><h4>pattern</h4><p>${esc(out.pattern)}</p></div>` +
    `<div class="ins up"><h4>increase</h4><p>${esc(out.increase)}</p></div>` +
    `<div class="ins down"><h4>reduce</h4><p>${esc(out.reduce)}</p></div>` +
    `<div class="ins note"><h4>note</h4><p>${esc(out.note)}</p></div>`))
}

/* =========================================================== CHROME ===== */

const VIEWS = { log: viewLog, week: viewWeek, stats: viewStats, insights: viewInsights }

async function render() {
  cache.day = null
  if (tab !== 'log') cache.range = null
  try {
    const d = await loadDay()
    $('kcal').textContent = d.totals.kcal || 0
    $('protein').textContent = d.totals.protein_g ? `${d.totals.protein_g}g protein` : ''
    document.querySelector('header .u').textContent =
      logDate === isoToday() ? 'kcal today' : `kcal on ${logDate}`
    await VIEWS[tab]()
  } catch {
    // Never leave a blank screen with a zero on it - that is indistinguishable
    // from a broken app and tells you nothing.
    view.innerHTML = ''
    view.appendChild(el('sect', '<p class="hint">Couldn\'t reach the server. Is it still running?</p>'))
  }
}

function switchTab(name) {
  tab = name
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === name))
  // The input stays on every tab. Hiding it on three of four screens meant
  // that "I can't type" was sometimes literally true, by design, and there was
  // nothing on screen to explain why.
  render()
}
document.querySelectorAll('nav button').forEach((b) => (b.onclick = () => switchTab(b.dataset.tab)))

function gate(message) {
  document.body.innerHTML = `<div class="gate"><h2>health agent</h2>
    <p style="color:#8b9199;font-size:14px">${esc(message || 'enter the passcode')}</p>
    <input id="p" type="password" style="width:100%;margin:8px 0" enterkeyhint="go">
    <button class="b go" id="ok" style="width:100%">unlock</button></div>`
  const go = () => { localStorage.setItem('passcode', $('p').value.trim()); location.reload() }
  $('ok').onclick = go
  $('p').addEventListener('keydown', (e) => { if (e.key === 'Enter') go() })
  $('p').focus()
}

function setDay(iso) {
  logDate = iso > isoToday() ? isoToday() : iso
  $('picker').value = logDate
  const past = logDate !== isoToday()
  $('daybar').classList.toggle('past', past)
  $('daytag').textContent = past ? `${dayName(logDate)} · backfilling` : dayName(logDate)
  $('next').disabled = !past          // no logging into the future
  chat = []                            // a new day starts a clean conversation
  history = []
  cache.day = null
  render()
}
$('prev').onclick = () => setDay(shiftIso(logDate, -1))
$('next').onclick = () => setDay(shiftIso(logDate, 1))
$('picker').addEventListener('change', () => $('picker').value && setDay($('picker').value))
setDay(logDate)

$('send').onclick = send
// MUST be addEventListener, not `onkeydown = ...`. An arrow body of
// `e.key === 'Enter' && send()` RETURNS FALSE for every other key, and
// returning false from an on* handler calls preventDefault() - which for a
// keydown means the character is never inserted. The box looked focused and
// silently swallowed everything typed into it. addEventListener ignores the
// return value, so the default action survives.
$('say').addEventListener('keydown', (e) => { if (e.key === 'Enter') send() })
render()

// Focus on load so you can just type. Skipped on touch, where it would throw
// the keyboard up before you have looked at anything.
if (!matchMedia('(pointer:coarse)').matches) $('say').focus()

// Only register in production. Service workers run on localhost too, so a
// cached shell would silently shadow every local edit - all cost, no benefit
// while developing. Any leftover registration is torn down here.
if ('serviceWorker' in navigator) {
  if (location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {})
  else {
    navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()))
    caches?.keys().then((ks) => ks.forEach((k) => caches.delete(k)))
  }
}
