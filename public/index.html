<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Calorie Counter</title>
<meta name="build" content="71b96aa">
<style>
:root{
  --bg:#0b0d10; --surface:#14171c; --raised:#1b1f26; --line:#242931; --line2:#2e343d;
  --text:#eef0f3; --muted:#8e96a1; --faint:#5d6570;
  --accent:#7dd88f; --accent2:#4fb864; --warn:#e0a35c; --danger:#e07a7a;
  /* macro series - validated for this dark surface (CVD dE 9.4, normal 20.9) */
  --protein:#3987e5; --carbs:#d95926; --fat:#199e70;
  --r:18px; --r2:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0}
button{font-family:inherit}

/* ---------------- top bar ---------------- */
header{
  display:flex; align-items:center; gap:10px; padding:12px 16px 10px; flex:0 0 auto;
}
header .brand{font-weight:700; font-size:16px; letter-spacing:-.01em; display:flex; align-items:center; gap:8px}
header .brand i{width:22px; height:22px; border-radius:7px; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:block}
.acct{
  margin-left:auto; display:flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--line);
  cursor:pointer; padding:4px 10px 4px 4px; color:var(--muted); font-size:12.5px; border-radius:999px;
}
.acct img{width:24px; height:24px; border-radius:50%}
.acct svg{width:16px; height:16px; margin:4px}

#daybar{display:flex; align-items:center; gap:8px; padding:0 16px 10px; flex:0 0 auto}
#daybar button{
  background:var(--surface); border:1px solid var(--line); color:var(--text); cursor:pointer;
  border-radius:10px; width:34px; height:34px; font-size:18px; line-height:1; padding:0;
}
#daybar button:disabled{opacity:.3; cursor:default}
#daybar input[type=date]{
  padding:6px 10px; font-size:14px; border-radius:10px; height:34px;
  border:1px solid var(--line); background:var(--surface); color:var(--text);
  font-family:inherit; color-scheme:dark;
}
#daytag{font-size:12.5px; color:var(--muted); margin-left:auto; text-align:right; line-height:1.25}
#daytag b{display:block; color:var(--text); font-weight:600}
#daybar.past input[type=date]{border-color:var(--accent); color:var(--accent)}

main{flex:1; overflow-y:auto; padding:4px 16px 16px; display:flex; flex-direction:column; gap:14px; min-height:0}

/* ---------------- cards ---------------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px}
.card.hero{
  background:linear-gradient(160deg,#171c22 0%, #12151a 60%, #0f1216 100%);
  border-color:var(--line2);
}
.card > h3, .lbl{
  font-size:11px; color:var(--faint); font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-bottom:12px;
}
/* flex, not float: two right-hand items used to land on top of each other */
.card > h3{display:flex; align-items:baseline; gap:10px}
.card > h3 .r{margin-left:auto; color:var(--faint); font-weight:500; letter-spacing:0; text-transform:none; font-size:12px}
.hint{color:var(--muted); font-size:13.5px; margin:0}
.row{display:flex; justify-content:space-between; gap:12px; padding:6px 0; font-variant-numeric:tabular-nums}
.row span:last-child{color:var(--muted); white-space:nowrap; font-size:13px}
.tot{border-top:1px solid var(--line); margin-top:8px; padding-top:10px; font-weight:600}
.tot span:last-child{color:var(--text)}
.acts{display:flex; gap:8px; margin-top:14px}
.b{
  flex:1; padding:12px; border-radius:var(--r2); border:1px solid var(--line2);
  background:var(--raised); color:var(--text); font-size:15px; font-weight:600; cursor:pointer;
}
.b.go{background:var(--accent); color:#0b0d10; border-color:var(--accent)}
.b:disabled{opacity:.4}
.pills{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
.pills button{
  background:var(--raised); border:1px solid var(--line); color:var(--muted);
  border-radius:999px; padding:6px 12px; font-size:12.5px; cursor:pointer;
}
.pills button.on{background:var(--accent); border-color:var(--accent); color:#0b0d10; font-weight:600}

/* ---------------- ring hero ---------------- */
.ringwrap{display:flex; align-items:center; gap:18px}
.ring{position:relative; width:138px; height:138px; flex:0 0 auto}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring circle{fill:none; stroke-width:10; stroke-linecap:round}
.ring .track{stroke:var(--raised)}
.ring .fill{stroke:var(--accent); transition:stroke-dasharray .6s ease}
.ring .fill.over{stroke:var(--warn)}
.ring .c{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.1}
.ring .c b{font-size:30px; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.ring .c small{font-size:11px; color:var(--muted); margin-top:3px}
.ringside{flex:1; min-width:0}
.ringside .kv{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); padding:5px 0; border-bottom:1px solid var(--line)}
.ringside .kv:last-child{border-bottom:0}
.ringside .kv b{color:var(--text); font-variant-numeric:tabular-nums}

/* ---------------- macro bars ---------------- */
.mrow{display:flex; align-items:center; gap:10px; padding:6px 0; font-size:13.5px}
.mrow .ml{width:56px; color:var(--muted); flex:0 0 auto}
.mrow .mt{flex:1; height:8px; background:var(--raised); border-radius:5px; position:relative; overflow:hidden}
.mrow .mt i{display:block; height:100%; border-radius:5px; transition:width .5s ease}
.mrow .mt u{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--faint); text-decoration:none}
.mrow .mv{width:88px; text-align:right; flex:0 0 auto; font-variant-numeric:tabular-nums}
.mrow .mv small{color:var(--faint); font-size:11px}

/* ---------------- meals ---------------- */
.meal{border-top:1px solid var(--line); padding-top:10px; margin-top:10px}
.meal:first-of-type{border-top:0; padding-top:0; margin-top:0}
.meal h4{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; margin-bottom:4px}
.meal h4 svg{width:15px; height:15px; color:var(--muted)}
.meal h4 .mk{margin-left:auto; color:var(--muted); font-weight:500; font-size:12.5px; font-variant-numeric:tabular-nums}
.ent{display:flex; align-items:center; gap:10px; padding:6px 0 6px 23px; font-variant-numeric:tabular-nums; font-size:14.5px}
.ent .n{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ent .k{color:var(--muted); font-size:13px}
.ent .x{background:none; border:0; color:var(--faint); font-size:18px; line-height:1; padding:2px 5px; cursor:pointer}
.ent .n{cursor:pointer}
.ed{display:flex; align-items:center; gap:5px; padding:8px 0 10px 23px; flex-wrap:wrap}
.ed input{
  width:58px; padding:7px 6px; font-size:15px; text-align:right; border-radius:9px;
  border:1px solid var(--line2); background:var(--raised); color:var(--text);
  font-family:inherit; font-variant-numeric:tabular-nums;
}
.ed input:focus{outline:none; border-color:var(--accent)}
.ed span{color:var(--faint); font-size:11.5px}
.ed button{padding:7px 10px; font-size:12.5px; border-radius:9px; border:1px solid var(--line2);
  background:var(--raised); color:var(--text); cursor:pointer}
.ed button.go{background:var(--accent); color:#0b0d10; border-color:var(--accent); font-weight:600}
.ed .meals{display:flex; gap:4px; flex-wrap:wrap; width:100%; margin:2px 0 4px}
.ed .meals button{padding:5px 9px; font-size:11.5px; border-radius:999px; color:var(--muted)}
.ed .meals button.on{border-color:var(--accent); color:var(--accent)}
.ed input[type=date]{width:auto; font-size:13px; text-align:left; color-scheme:dark}
.moveday{background:none; border:0; color:var(--muted); font-size:12px; cursor:pointer; font-weight:500;
  letter-spacing:0; text-transform:none; padding:0; margin-left:auto}
.moveday:active{color:var(--accent)}
.ent .x:active{color:var(--danger)}

/* ---------------- intro ---------------- */
.intro{margin:auto 0; padding:8px 2px}
.intro h1{font-size:22px; margin-bottom:6px; font-weight:700; letter-spacing:-.01em}
.intro p{margin:0 0 18px; color:var(--muted); font-size:14px; max-width:34ch}
.eg{
  display:block; width:100%; text-align:left; margin-bottom:8px; padding:12px 14px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r2);
  color:var(--text); font:inherit; cursor:pointer;
}
.eg:active{border-color:var(--muted)}

/* ---------------- chat ---------------- */
.msg{max-width:88%; padding:10px 14px; border-radius:var(--r); white-space:pre-wrap; word-wrap:break-word}
.me{align-self:flex-end; background:#24303f; border-bottom-right-radius:5px}
.bot{align-self:flex-start; background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:5px}
.tools{align-self:flex-start; color:var(--faint); font-size:12px; font-family:ui-monospace,monospace}
.err{align-self:flex-start; color:var(--danger); font-size:13px}
.banner{
  background:var(--raised); border:1px solid var(--line); border-left:3px solid var(--warn);
  border-radius:var(--r2); padding:10px 12px; font-size:13px; color:var(--muted);
}
.banner b{color:var(--text)}

/* ---------------- editable proposal ---------------- */
.prow{padding:10px 0; border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .pn{display:block; margin-bottom:6px; font-size:14.5px}
.prow .pctl{display:flex; align-items:center; gap:6px}
.prow input{
  width:54px; flex:0 0 auto; padding:7px 6px; font-size:14px; text-align:right;
  border-radius:9px; border:1px solid var(--line2); background:var(--raised);
  color:var(--text); font-family:inherit; font-variant-numeric:tabular-nums;
}
.prow input:focus{outline:none; border-color:var(--accent)}
.prow .unit{color:var(--faint); font-size:11.5px; flex:0 0 auto}
.prow .sub{color:var(--text); font-size:13.5px; margin-left:auto; flex:0 0 auto; font-variant-numeric:tabular-nums}
.prow .drop{background:none; border:0; color:var(--faint); font-size:18px; cursor:pointer; padding:2px 2px 2px 8px}
.edited{color:var(--accent); font-size:12px; margin-top:9px}
.mealpick{display:flex; gap:6px; margin:4px 0 8px; flex-wrap:wrap}
.mealpick button{background:var(--raised); border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:4px 10px; font-size:12px; cursor:pointer}
.mealpick button.on{border-color:var(--accent); color:var(--accent)}

/* ---------------- charts ---------------- */
svg.chart{display:block; width:100%; height:auto; overflow:visible}
.bar{cursor:pointer}
.bar rect.hit{fill:transparent}
.axis{font-size:10px; fill:var(--faint)}
.axis.on{fill:var(--text)}
.vlabel{font-size:10.5px; fill:var(--muted); font-variant-numeric:tabular-nums}
.gridline{stroke:var(--line); stroke-width:1}
.avgline{stroke:var(--faint); stroke-width:1; stroke-dasharray:3 3}
.goalline{stroke:var(--accent); stroke-width:1; stroke-dasharray:4 3; opacity:.7}
.legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:11px}
.legend div{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted)}
.legend i{width:9px; height:9px; border-radius:2px; display:block}
.stack{display:flex; gap:2px; height:24px; border-radius:6px; overflow:hidden; margin-top:2px}
.stack span{display:block}
.sm{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.sm figure{margin:0}
.sm figcaption{font-size:11.5px; color:var(--muted); margin-bottom:3px; display:flex; justify-content:space-between}
.sm figcaption b{color:var(--text); font-weight:600; font-variant-numeric:tabular-nums}
.frow{display:flex; align-items:center; gap:10px; padding:5px 0; font-size:14px}
.frow .fn{width:38%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.frow .fb{flex:1; height:8px; background:var(--raised); border-radius:4px; overflow:hidden}
.frow .fb i{display:block; height:100%; background:var(--accent); border-radius:4px}
.frow .fc{color:var(--muted); font-size:12.5px; font-variant-numeric:tabular-nums; width:52px; text-align:right}
.bignum{display:flex; align-items:baseline; gap:9px; margin-bottom:4px}
.bignum b{font-size:34px; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.bignum span{color:var(--muted); font-size:13px}
.bignum .delta{margin-left:auto; font-size:12px; color:var(--faint)}
.stat3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.stat3 div{background:var(--raised); border-radius:var(--r2); padding:10px 12px}
.stat3 b{display:block; font-size:20px; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.stat3 small{color:var(--faint); font-size:11px; text-transform:uppercase; letter-spacing:.05em}
.stat3 .down{color:var(--accent)} .stat3 .up{color:var(--warn)}

/* ---------------- weight entry ---------------- */
.wform{display:flex; gap:8px; align-items:center}
.wform input{
  flex:1; padding:12px 14px; font-size:20px; text-align:center; border-radius:var(--r2);
  border:1px solid var(--line2); background:var(--raised); color:var(--text); font-family:inherit;
  font-variant-numeric:tabular-nums;
}
.wform input:focus{outline:none; border-color:var(--accent)}
.wform .b{flex:0 0 auto; padding:12px 18px}

/* ---------------- settings ---------------- */
.field{margin-bottom:12px}
.field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px}
.field input{
  width:100%; padding:11px 12px; font-size:16px; border-radius:var(--r2);
  border:1px solid var(--line2); background:var(--raised); color:var(--text); font-family:inherit;
}
.field input:focus{outline:none; border-color:var(--accent)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}

/* ---------------- insight cards ---------------- */
.ins{border-left:3px solid var(--line2); padding:2px 0 2px 12px; margin-bottom:14px}
.ins.up{border-color:var(--fat)} .ins.down{border-color:var(--carbs)} .ins.note{border-color:var(--faint)}
.ins h4{font-size:11px; color:var(--faint); font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-bottom:3px}
.ins p{margin:0; font-size:14.5px}

/* ---------------- chrome ---------------- */
footer{padding:10px 12px; border-top:1px solid var(--line); display:flex; gap:8px; background:var(--bg); flex:0 0 auto}
input#say{
  flex:1; padding:12px 14px; border-radius:var(--r2); border:1px solid var(--line2);
  background:var(--surface); color:var(--text); font-size:16px; font-family:inherit;
}
input#say::placeholder{color:var(--faint)}
input#say:focus{outline:none; border-color:var(--accent)}
#send{flex:0 0 auto; width:46px; padding:0; display:flex; align-items:center; justify-content:center}
#send svg{width:20px; height:20px}
nav{
  display:flex; border-top:1px solid var(--line); background:var(--bg); flex:0 0 auto;
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1; padding:9px 4px 10px; background:none; border:0; cursor:pointer;
  color:var(--faint); font:inherit; font-size:11px; display:flex; flex-direction:column; align-items:center; gap:3px;
}
nav button svg{width:22px; height:22px}
nav button.on{color:var(--accent)}

/* ---------------- auth screens ---------------- */
.gate{margin:auto; padding:26px 22px; max-width:380px; width:100%}

/* ---------- onboarding wizard ---------- */
.wiz{min-height:100%; display:flex; flex-direction:column; max-width:520px; margin:0 auto; width:100%;
  padding:22px 22px calc(22px + env(safe-area-inset-bottom))}
.dots{display:flex; gap:6px; margin-bottom:26px; flex:0 0 auto}
.dots i{height:3px; flex:1; border-radius:2px; background:var(--line); transition:background .3s}
.dots i.on{background:var(--accent)}
.pane{flex:1; display:flex; flex-direction:column; min-height:0}
.pane.in-next{animation:inNext .34s cubic-bezier(.2,.75,.3,1) both}
.pane.in-back{animation:inBack .34s cubic-bezier(.2,.75,.3,1) both}
@keyframes inNext{from{opacity:0; transform:translateX(26px)} to{opacity:1; transform:none}}
@keyframes inBack{from{opacity:0; transform:translateX(-26px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){ .pane.in-next,.pane.in-back{animation:none} }

.pane .mark{width:54px; height:54px; border-radius:16px; display:block; margin-bottom:20px}
.pane h1{font-size:27px; line-height:1.2; letter-spacing:-.02em; font-weight:700; margin-bottom:12px}
.pane h1 em{font-style:normal; color:var(--accent)}
.pane .lead{color:var(--muted); font-size:15.5px; line-height:1.6; margin:0 0 8px; max-width:38ch}
.pane .spacer{flex:1; min-height:18px}
.pane .cta{display:flex; flex-direction:column; gap:10px; flex:0 0 auto}
.pane .cta .b{width:100%; padding:14px}
.skip{background:none; border:0; color:var(--faint); font-size:13px; cursor:pointer; padding:8px}

.flow{margin:6px 0 0}
.flow .ln{display:flex; gap:13px; align-items:flex-start; padding:11px 0}
.flow .n{flex:0 0 auto; width:25px; height:25px; border-radius:8px; background:var(--raised); color:var(--accent);
  font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px}
.flow .ln p{margin:0; font-size:14.5px; line-height:1.55; color:var(--text)}
.flow .ln p span{display:block; color:var(--muted); font-size:13.5px; white-space:normal; margin-top:2px}
.flow .tail{margin:14px 0 0; padding:12px 14px; background:var(--raised); border-radius:var(--r2);
  font-size:13.5px; color:var(--muted); line-height:1.55}
.flow .tail b{color:var(--accent)}
.pane code{background:var(--raised); padding:2px 7px; border-radius:5px; font-size:13px; color:var(--text)}

.pane input{width:100%; background:var(--raised); border:1px solid var(--line); color:var(--text);
  border-radius:var(--r2); padding:14px 15px; font:inherit; font-size:15px; text-align:left}
.pane input:focus{outline:none; border-color:var(--accent)}
.pane input::placeholder{color:var(--faint)}
.keysteps{counter-reset:k; margin:4px 0 0; padding:0; list-style:none}
.keysteps li{counter-increment:k; position:relative; padding:9px 0 9px 32px; font-size:14.5px; color:var(--muted); line-height:1.5}
.keysteps li::before{content:counter(k); position:absolute; left:0; top:8px; width:21px; height:21px;
  border-radius:50%; background:var(--raised); color:var(--accent); font-size:11px; font-weight:700;
  display:flex; align-items:center; justify-content:center}
.keysteps a{color:var(--accent)}
.pane .foot{color:var(--faint); font-size:12.5px; text-align:center; margin-top:14px}
.pane .foot a{color:var(--muted)}
.rise{animation:rise .35s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){ .rise{animation:none} }
.gate h2{font-size:24px; margin-bottom:6px; letter-spacing:-.01em}
.gate p{color:var(--muted); font-size:14px; margin:0 0 20px}
.gate input{width:100%; margin:6px 0 2px}
.gsi{
  display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
  padding:13px; border-radius:var(--r2); border:1px solid var(--line); background:#fff;
  color:#1f1f1f; font:inherit; font-size:15px; font-weight:600; cursor:pointer; text-decoration:none;
}
.gsi svg{width:18px; height:18px}
.plan{border:1px solid var(--line); border-radius:var(--r2); padding:14px; margin-bottom:10px; cursor:pointer; background:var(--surface)}
.plan.sel{border-color:var(--accent)}
.plan h4{font-size:15px; margin-bottom:3px}
.plan .tag{float:right; font-size:11px; color:var(--accent); text-transform:uppercase; letter-spacing:.05em}
.plan p{font-size:13px; color:var(--muted); margin:0}
</style>
</head>
<body>
<header>
  <div class="brand"><i></i>Calorie Counter</div>
  <button class="acct" id="acct" title="settings"></button>
</header>

<div id="daybar">
  <button id="prev" title="previous day">‹</button>
  <input type="date" id="picker">
  <button id="next" title="next day">›</button>
  <span id="daytag"></span>
</div>

<main id="view"></main>

<footer id="bar">
  <input id="say" placeholder="what did you eat?" autocomplete="off" enterkeyhint="send">
  <button class="b go" id="send" aria-label="send">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
  </button>
</footer>

<nav>
  <button data-tab="log" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 3v18M4 12c0-5 2-9 4-9v18M15 3v18M15 12h4V3a4 4 0 0 0-4 0z"/></svg>Log</button>
  <button data-tab="trends">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Trends</button>
  <button data-tab="body">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4z"/><path d="M9 12l2 2 4-4"/></svg>Body</button>
  <button data-tab="insights">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>Insights</button>
</nav>

<script type="module">
/* ===================================================================== state */
const $ = (id) => document.getElementById(id)
const view = $('view')
let tab = 'log'
let history = []
let chat = []
let me = null
let pass = localStorage.getItem('passcode') || ''
// Days already fetched are kept, so stepping back to one you just looked at
// is instant. Anything that writes clears the lot.
const cache = { days: new Map(), range: null, body: null, insights: null }
const forget = () => { cache.days.clear(); cache.range = null; cache.body = null }
let pickedDay = null

const headers = () => ({ 'content-type': 'application/json', 'x-passcode': pass })
const esc = (s) => String(s).replace(/[<>&"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]))
const cap = (t) => { const x = String(t); return x.charAt(0).toUpperCase() + x.slice(1) }
const qtyLabel = (qty, unit) => ['g', 'ml'].includes(String(unit).toLowerCase()) ? `${qty}${unit}` : `${qty} ×`
const el = (cls, html) => { const d = document.createElement('div'); d.className = cls; if (html != null) d.innerHTML = html; return d }
const api = async (path, opts) => {
  const r = await fetch(path, { headers: headers(), ...opts })
  if (r.status === 401) { gate('wrong passcode'); throw new Error('unauthorized') }
  const data = await r.json().catch(() => ({}))
  // Surface the server's own message. "Couldn't reach the server" for a
  // database error sent the user chasing the wrong problem.
  if (!r.ok && !opts?.method) { const e = new Error(data.error || `server error ${r.status}`); e.server = true; throw e }
  return data
}

/* ---------- dates ---------- */
const isoToday = () => { const d = new Date(), p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}` }
const shiftIso = (iso, by) => { const [y, m, d] = iso.split('-').map(Number); const t = new Date(y, m - 1, d + by), p = (n) => String(n).padStart(2, '0'); return `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}` }
const asDate = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d) }
const DOW = ['S', 'M', 'T', 'W', 'T', 'F', 'S']
const DAYS_FULL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday']
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
const dayName = (iso) => DAYS_FULL[asDate(iso).getDay()]
const shortDate = (iso) => `${asDate(iso).getDate()} ${MONTHS[asDate(iso).getMonth()]}`
const prettyDate = (iso) => {
  const rel = iso === isoToday() ? 'Today' : iso === shiftIso(isoToday(), -1) ? 'Yesterday' : null
  const base = `${dayName(iso)}, ${shortDate(iso)}`
  return rel ? `${rel} · ${base}` : base
}
let logDate = isoToday()

/* ================================================================ macros */
const MACROS = [
  { k: 'protein_g', t: 'target_protein_g', label: 'protein', v: 'protein', kcalPerG: 4 },
  { k: 'carbs_g',   t: 'target_carbs_g',   label: 'carbs',   v: 'carbs',   kcalPerG: 4 },
  { k: 'fat_g',     t: 'target_fat_g',     label: 'fat',     v: 'fat',     kcalPerG: 9 },
  { k: 'sugar_g',   t: 'target_sugar_g',   label: 'sugar',   v: 'carbs',   kcalPerG: 4, sub: true },
  // Fibre is a carbohydrate the body barely absorbs, so it is shown but never
  // counted toward the energy split.
  { k: 'fiber_g',   t: 'target_fiber_g',   label: 'fibre',   v: 'fat',     kcalPerG: 0, sub: true },
]

// Bars fill toward the TARGET when one is set, else toward the user's own
// average - no invented daily numbers.
function macroPanel(totals, targets = {}, avg = null) {
  const energy = MACROS.filter((m) => !m.sub).reduce((t, m) => t + (totals[m.k] || 0) * m.kcalPerG, 0)
  return MACROS.map((m) => {
    const g = totals[m.k] || 0
    const target = targets?.[m.t] || 0
    const ref = target || avg?.[m.k] || 0
    const top = ref ? ref * 1.15 : Math.max(g, 1) * 1.25
    const pct = energy && !m.sub ? Math.round((g * m.kcalPerG / energy) * 100) : null
    // Exceeding protein is the point, not a problem - only the others warn.
    const over = target && g > target * 1.05 && m.k !== 'protein_g'
    return `<div class="mrow">
      <span class="ml">${m.label}</span>
      <span class="mt">
        <i style="width:${Math.min(100, g / top * 100)}%;background:${over ? 'var(--warn)' : `var(--${m.v})`};${m.sub ? 'opacity:.6' : ''}"></i>
        ${ref ? `<u style="left:${Math.min(99, ref / top * 100)}%"></u>` : ''}
      </span>
      <span class="mv">${Math.round(g)}${target ? `<small>/${Math.round(target)}g</small>` : 'g'}${pct !== null && !target ? ` <small>${pct}%</small>` : ''}</span>
    </div>`
  }).join('')
}

/* ================================================================== ring */
function ringHero(d) {
  const target = d.targets?.target_kcal || 0
  const eaten = d.totals.kcal || 0
  const R = 60, C = 2 * Math.PI * R
  const frac = target ? Math.min(1, eaten / target) : 0
  const left = target ? Math.round(target - eaten) : null
  const over = target && eaten > target
  const center = target
    ? `<b>${Math.abs(left)}</b><small>${over ? 'over target' : `left of ${Math.round(target)}`}</small>`
    : `<b>${eaten}</b><small>kcal · no target</small>`
  const p = d.totals.protein_g || 0, pt = d.targets?.target_protein_g || 0
  return `<div class="ringwrap">
    <div class="ring">
      <svg viewBox="0 0 140 140">
        <circle class="track" cx="70" cy="70" r="${R}"></circle>
        <circle class="fill ${over ? 'over' : ''}" cx="70" cy="70" r="${R}"
          stroke-dasharray="${(frac * C).toFixed(1)} ${C.toFixed(1)}"></circle>
      </svg>
      <div class="c">${center}</div>
    </div>
    <div class="ringside">
      <div class="kv"><span>eaten</span><b>${eaten} kcal</b></div>
      <div class="kv"><span>protein</span><b>${Math.round(p)}g${pt ? ` <span style="color:var(--faint)">/ ${Math.round(pt)}</span>` : ''}</b></div>
      <div class="kv"><span>${target ? 'target' : 'set a target'}</span><b>${target ? `${Math.round(target)} kcal` : `<a href="#" id="setT" style="color:var(--accent)">settings →</a>`}</b></div>
    </div>
  </div>`
}

/* ================================================================= meals */
const MEAL_ORDER = ['breakfast', 'lunch', 'dinner', 'snack', null]
const MEAL_ICON = {
  breakfast: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  lunch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11h18a9 9 0 0 1-18 0zM3 11a9 9 0 0 1 18 0"/><path d="M12 2v2"/></svg>',
  dinner: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>',
  snack: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3c3 0 5 2 5 5 0 5-5 13-5 13S7 13 7 8c0-3 2-5 5-5z"/></svg>',
  null: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>',
}

function mealGroups(rows, editable = true) {
  const groups = {}
  for (const r of rows) (groups[r.meal ?? null] ??= []).push(r)
  return MEAL_ORDER.filter((m) => groups[m]?.length).map((m) => {
    const list = groups[m]
    const kcal = list.reduce((t, r) => t + (r.kcal || 0), 0)
    return `<div class="meal">
      <h4>${MEAL_ICON[m]}${m ? cap(m) : 'Unsorted'}<span class="mk">${kcal} kcal</span></h4>
      ${list.map((r) => `<div class="ent" data-id="${r.id}">
        <span class="n">${qtyLabel(r.qty, r.unit)} ${esc(cap(r.name))}</span>
        <span class="k">${r.kcal} kcal</span>
        ${editable ? '<button class="x" title="remove">×</button>' : ''}
      </div>`).join('')}
    </div>`
  }).join('')
}

/* ============================================================== charts */
function weekChart(days, avg, metric, picked, color) {
  const W = 320, H = 150, PAD_B = 22, PAD_T = 14
  const max = Math.max(...days.map((d) => d[metric] || 0), avg, 1)
  const scale = (v) => (H - PAD_B - PAD_T) * (v / max)
  const bw = W / days.length, inner = bw - 6
  const bars = days.map((d, i) => {
    const value = d[metric] || 0, h = scale(value), x = i * bw + 3, y = H - PAD_B - h, on = d.date === picked
    return `<g class="bar" data-date="${d.date}">
      <rect class="hit" x="${i * bw}" y="0" width="${bw}" height="${H}"></rect>
      ${value ? `<rect x="${x}" y="${y}" width="${inner}" height="${h}" rx="4" fill="${on ? 'var(--accent)' : color}"></rect>`
              : `<rect x="${x}" y="${H - PAD_B - 3}" width="${inner}" height="3" rx="1.5" fill="var(--line)"></rect>`}
      ${days.length <= 14 ? `<text class="axis ${on ? 'on' : ''}" x="${x + inner / 2}" y="${H - 8}" text-anchor="middle">${DOW[asDate(d.date).getDay()]}</text>` : ''}
      ${on && value ? `<text class="vlabel" x="${x + inner / 2}" y="${y - 5}" text-anchor="middle">${Math.round(value)}</text>` : ''}
    </g>`
  }).join('')
  const ay = H - PAD_B - scale(avg)
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
    <line class="gridline" x1="0" y1="${H - PAD_B}" x2="${W}" y2="${H - PAD_B}"></line>
    ${avg ? `<line class="avgline" x1="0" y1="${ay}" x2="${W}" y2="${ay}"></line>` : ''}
    ${bars}</svg>`
}

function macroStack(t) {
  const parts = [
    { k: 'protein', label: 'protein', kcal: (t.protein_g || 0) * 4, v: t.protein_g },
    { k: 'carbs', label: 'carbs', kcal: (t.carbs_g || 0) * 4, v: t.carbs_g },
    { k: 'fat', label: 'fat', kcal: (t.fat_g || 0) * 9, v: t.fat_g },
  ]
  const sum = parts.reduce((a, p) => a + p.kcal, 0)
  if (!sum) return '<p class="hint">No macros recorded yet.</p>'
  return `<div class="stack">${parts.map((p) => `<span style="flex:${p.kcal};background:var(--${p.k})"></span>`).join('')}</div>
    <div class="legend">${parts.map((p) => `<div><i style="background:var(--${p.k})"></i>${p.label} ${Math.round(p.v)}g · ${Math.round(p.kcal / sum * 100)}%</div>`).join('')}</div>`
}

function spark(days, key, color) {
  const W = 150, H = 40
  const vals = days.map((d) => d[key] || 0), max = Math.max(...vals, 1), bw = W / days.length
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${vals.map((v, i) => {
    const h = v / max * (H - 4)
    return `<rect x="${i * bw + 0.8}" y="${H - h}" width="${Math.max(1.4, bw - 1.6)}" height="${h || 1}" rx="1.4" fill="${v ? color : 'var(--line)'}"></rect>`
  }).join('')}</svg>`
}

// Weight: dots for readings, a line for the 7-day average, a dashed goal.
function weightChart(series, goal) {
  const W = 320, H = 160, PL = 34, PR = 8, PT = 12, PB = 22
  if (!series.length) return ''
  const ys = series.flatMap((s) => [s.kg, s.avg]).concat(goal ? [goal] : [])
  let lo = Math.min(...ys), hi = Math.max(...ys)
  const pad = Math.max(0.5, (hi - lo) * 0.15); lo -= pad; hi += pad
  const x = (i) => PL + (series.length === 1 ? (W - PL - PR) / 2 : i * (W - PL - PR) / (series.length - 1))
  const y = (v) => PT + (H - PT - PB) * (1 - (v - lo) / (hi - lo))
  const line = series.map((s, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(s.avg).toFixed(1)}`).join('')
  const ticks = [lo + pad, (lo + hi) / 2, hi - pad]
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight">
    ${ticks.map((t) => `<line class="gridline" x1="${PL}" y1="${y(t)}" x2="${W - PR}" y2="${y(t)}"></line>
      <text class="axis" x="${PL - 6}" y="${y(t) + 3.5}" text-anchor="end">${t.toFixed(1)}</text>`).join('')}
    ${goal ? `<line class="goalline" x1="${PL}" y1="${y(goal)}" x2="${W - PR}" y2="${y(goal)}"></line>
              <text class="vlabel" x="${W - PR}" y="${y(goal) - 4}" text-anchor="end" style="fill:var(--accent)">goal ${goal}</text>` : ''}
    ${series.map((s, i) => `<circle cx="${x(i)}" cy="${y(s.kg)}" r="2.6" fill="var(--faint)"></circle>`).join('')}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"></path>
    <text class="axis" x="${PL}" y="${H - 6}">${shortDate(series[0].date)}</text>
    <text class="axis" x="${W - PR}" y="${H - 6}" text-anchor="end">${shortDate(series.at(-1).date)}</text>
  </svg>`
}

/* ================================================================== log */
const EXAMPLES = ['2 dosa and sambar', 'a bowl of curd rice', '2 eggs and 2 chapati']

function bubble(cls, text) {
  const d = el(cls); d.textContent = text
  chat.push(d)
  if (tab === 'log') { view.appendChild(d); view.scrollTop = view.scrollHeight }
  return d
}

function intro() {
  const box = el('intro', `<h1>What did you eat?</h1>
    <p>Type it however you'd say it. I work out the calories, you confirm, it's logged.</p>
    <div class="lbl">try</div>` + EXAMPLES.map((e) => `<button class="eg">${esc(e)}</button>`).join(''))
  box.querySelectorAll('.eg').forEach((b) => (b.onclick = () => { $('say').value = b.textContent; send() }))
  return box
}

async function loadDay() {
  if (!cache.days.has(logDate)) cache.days.set(logDate, api(`/api/day?date=${logDate}`).catch((e) => { cache.days.delete(logDate); throw e }))
  return cache.days.get(logDate)
}
async function loadRange(days = 7) {
  if (cache.range?.n !== days) cache.range = { n: days, p: api(`/api/range?days=${days}`) }
  return cache.range.p
}
async function loadBody() { return (cache.body ??= await api('/api/body')) }

async function viewLog() {
  const d = await loadDay()
  view.innerHTML = ''

  const hero = el('card hero', `<h3>${prettyDate(logDate)}</h3>${ringHero(d)}<div style="height:12px"></div>${macroPanel(d.totals, d.targets)}`)
  view.appendChild(hero)
  hero.querySelector('#setT')?.addEventListener('click', (e) => { e.preventDefault(); settingsScreen() })
  if (!d.targets?.target_kcal) {
    loadRange(30).then((r) => { if (r?.daysLogged && hero.isConnected)
      hero.querySelector('.mrow')?.parentElement && (hero.innerHTML = `<h3>${prettyDate(logDate)}</h3>${ringHero(d)}<div style="height:12px"></div>${macroPanel(d.totals, d.targets, r.averages)}`) }).catch(() => {})
  }

  if (d.rows.length) {
    const box = el('card', `<h3>what you ate<span class="r">${d.rows.length} items</span>
      <button class="moveday">move day →</button></h3>${mealGroups(d.rows)}`)
    // Writing up yesterday after midnight dates the whole lot to the new day.
    box.querySelector('.moveday').onclick = async () => {
      const to = prompt(`Move all ${d.rows.length} entries from ${logDate} to which date?`, shiftIso(logDate, -1))
      if (!to || !/^\d{4}-\d{2}-\d{2}$/.test(to) || to === logDate) return
      const out = await api('/api/day', { method: 'PATCH', body: JSON.stringify({ from: logDate, to }) })
      if (out.moved) { forget(); setDay(to) } else alert(out.error || 'nothing moved')
    }
    box.querySelectorAll('.ent').forEach((row) => {
      const entry = d.rows.find((r) => String(r.id) === row.dataset.id)
      row.querySelector('.x').onclick = async () => {
        row.style.opacity = .4
        const out = await api(`/api/entry?id=${row.dataset.id}`, { method: 'DELETE' })
        out.deleted ? (forget(), render()) : (row.style.opacity = 1)
      }
      // Tap the name to fix just this entry - a wrong quantity on one day is
      // not a reason to argue with the agent, and must not change the food.
      row.querySelector('.n').onclick = () => {
        if (row.nextElementSibling?.classList.contains('ed')) return row.nextElementSibling.remove()
        const isWeight = ['g', 'ml'].includes(String(entry.unit).toLowerCase())
        const ed = el('ed', `
          <div class="meals">${['breakfast','lunch','dinner','snack']
            .map((m) => `<button data-m="${m}" class="${m === entry.meal ? 'on' : ''}">${cap(m)}</button>`).join('')}</div>
          <input class="q" type="number" inputmode="decimal" min="0" step="${isWeight ? 10 : 0.5}" value="${entry.qty}">
          <span>${esc(entry.unit ?? '')}</span>
          <input class="k" type="number" inputmode="numeric" min="0" step="5" value="${entry.kcal}">
          <span>kcal</span>
          <input class="dt" type="date" value="${entry.date}" max="${isoToday()}">
          <button class="cancel">cancel</button><button class="go save">save</button>`)
        row.after(ed)
        // Changing the quantity rescales the calories, so the number you are
        // about to accept is the one you will see.
        const q = ed.querySelector('.q'), k = ed.querySelector('.k')
        const perUnit = entry.qty ? entry.kcal / Number(entry.qty) : 0
        q.addEventListener('input', () => { const v = parseFloat(q.value); if (Number.isFinite(v)) k.value = Math.round(perUnit * v) })
        let meal = entry.meal
        ed.querySelectorAll('.meals button').forEach((b) => (b.onclick = () => {
          meal = b.dataset.m
          ed.querySelectorAll('.meals button').forEach((x) => x.classList.toggle('on', x === b))
        }))
        ed.querySelector('.cancel').onclick = () => ed.remove()
        ed.querySelector('.save').onclick = async () => {
          ed.querySelectorAll('button').forEach((b) => (b.disabled = true))
          const out = await api('/api/entry', { method: 'PATCH',
            body: JSON.stringify({ id: entry.id, qty: parseFloat(q.value), kcal: parseFloat(k.value),
                                   meal, date: ed.querySelector('.dt').value }) })
          if (out.updated) { forget(); render() } else { ed.querySelectorAll('button').forEach((b) => (b.disabled = false)) }
        }
        q.focus(); q.select()
      }
    })
    view.appendChild(box)
  } else if (!chat.length) view.appendChild(intro())

  if (me?.signedIn && me.user.plan === 'hosted' && !sessionStorage.getItem('hostedNote')) {
    view.appendChild(el('banner', `<b>You're on the agent's key.</b> This will need a subscription once payments are live.`))
    sessionStorage.setItem('hostedNote', '1')
  }
  chat.forEach((n) => view.appendChild(n))
  view.scrollTop = view.scrollHeight
}

/* ============================================================ proposal */
function proposalCard(p) {
  const rows = p.rows.map((r) => ({ ...r }))
  let meal = p.meal ?? null
  const box = el('card', `<h3>${prettyDate(p.date)}</h3>
    <div class="mealpick">${['breakfast', 'lunch', 'dinner', 'snack'].map((m) => `<button data-m="${m}" class="${m === meal ? 'on' : ''}">${cap(m)}</button>`).join('')}</div>
    <div class="plist"></div>
    <div class="row tot"><span>total</span><span class="grand"></span></div>
    <div class="edited" hidden></div>
    <div class="acts"><button class="b" data-a="no">cancel</button><button class="b go" data-a="yes">log it</button></div>`)
  box.querySelectorAll('.mealpick button').forEach((b) => (b.onclick = () => {
    meal = b.dataset.m
    box.querySelectorAll('.mealpick button').forEach((x) => x.classList.toggle('on', x === b))
  }))

  const list = box.querySelector('.plist'), grand = box.querySelector('.grand'), editedNote = box.querySelector('.edited')
  const paint = () => {
    const live = rows.filter((r) => !r.dropped)
    const kcal = live.reduce((t, r) => t + Math.round(r.kcal_per_unit * r.qty / (r.basis || 1)), 0)
    const protein = Math.round(live.reduce((t, r) => {
      const ratio = r.proteinEdited ? 1 : (r.orig_kcal ? r.kcal_per_unit / r.orig_kcal : 1)
      return t + r.protein_per_unit * ratio * r.qty / (r.basis || 1)
    }, 0) * 10) / 10
    grand.textContent = `${kcal} kcal · ${protein}g protein`
    box.querySelector('[data-a=yes]').disabled = live.length === 0
    const changed = rows.filter((r) => !r.dropped && (Math.abs(r.kcal_per_unit - r.orig_kcal) >= 0.5 || r.proteinEdited))
    editedNote.hidden = !changed.length
    if (changed.length) editedNote.textContent = `saves the corrected value for ${changed.map((r) => r.name).join(', ')}`
  }
  rows.forEach((r) => {
    r.orig_kcal = r.kcal_per_unit
    r.orig_protein = r.protein_per_unit ?? 0
    r.protein_per_unit = r.protein_per_unit ?? (r.qty ? (r.protein_g * (r.basis || 1)) / r.qty : 0)
    const line = el('prow', `<span class="pn">${esc(cap(r.name))}</span>
      <div class="pctl">
        <input class="q" type="number" inputmode="decimal" min="0" step="0.5" value="${r.qty}">
        <span class="unit">${esc(r.basis > 1 ? r.unit : '× ' + r.unit)}</span>
        <input class="k" type="number" inputmode="numeric" min="0" step="5" value="${Math.round(r.kcal_per_unit)}">
        <span class="unit">kcal</span>
        <input class="p" type="number" inputmode="decimal" min="0" step="0.5" value="${Math.round((r.protein_per_unit ?? 0) * 10) / 10}">
        <span class="unit">P${r.basis > 1 ? '/100' + esc(r.unit) : ''}</span>
        <span class="sub"></span>
        <button class="drop" title="remove">×</button>
      </div>`)
    const sub = line.querySelector('.sub')
    const redraw = () => { sub.textContent = `${Math.round(r.kcal_per_unit * r.qty / (r.basis || 1))} kcal`; paint() }
    line.querySelector('.q').addEventListener('input', (e) => { const v = parseFloat(e.target.value); r.qty = Number.isFinite(v) && v >= 0 ? v : 0; redraw() })
    line.querySelector('.k').addEventListener('input', (e) => { const v = parseFloat(e.target.value); r.kcal_per_unit = Number.isFinite(v) && v >= 0 ? v : 0; redraw() })
    line.querySelector('.p').addEventListener('input', (e) => { const v = parseFloat(e.target.value); r.protein_per_unit = Number.isFinite(v) && v >= 0 ? v : 0; r.proteinEdited = true; redraw() })
    line.querySelector('.drop').onclick = () => { r.dropped = true; line.remove(); paint() }
    list.appendChild(line); redraw()
  })
  paint()

  box.querySelector('[data-a=no]').onclick = () => {
    box.querySelector('.acts').remove(); bubble('tools', 'not logged')
    history.push({ role: 'user', text: '(I cancelled that - do not log it)' })
  }
  box.querySelector('[data-a=yes]').onclick = async () => {
    box.querySelectorAll('button').forEach((b) => (b.disabled = true))
    const items = rows.filter((r) => !r.dropped && r.qty > 0).map((r) => ({
      name: r.name, qty: r.qty, kcal_per_unit: r.kcal_per_unit,
      ...(r.proteinEdited ? { protein_per_unit: r.protein_per_unit } : {}),
    }))
    const out = await api('/api/commit', { method: 'POST', body: JSON.stringify({ date: p.date, meal, items }) })
    box.querySelector('.acts')?.remove()
    if (out.written) {
      bubble('tools', `logged · ${out.totals.kcal} kcal${meal ? ` · ${meal}` : ''}`)
      const edits = (out.corrected ?? []).map((c) =>
        `${c.name} is ${c.to} kcal` + (c.protein_to != null ? ` and ${c.protein_to}g protein` : '') + ` per unit, not ${c.from}` + (c.protein_from != null ? `/${c.protein_from}g` : ''))
      history.push({ role: 'user', text: `(I confirmed and logged: ${items.map((i) => `${i.qty} x ${i.name}`).join(', ')}` + (edits.length ? `. Remember: ${edits.join('; ')}` : '') + ')' })
      if (edits.length) bubble('tools', `learned · ${edits.join('; ')}`)
      forget()
      render()
    } else bubble('err', out.error || 'could not save')
  }
  chat.push(box)
  if (tab === 'log') { view.appendChild(box); view.scrollTop = view.scrollHeight }
}

async function send() {
  const text = $('say').value.trim()
  if (!text) return
  $('say').value = ''
  if (tab !== 'log') switchTab('log')
  view.querySelector('.intro')?.remove()
  bubble('msg me', text)
  history.push({ role: 'user', text })
  // A silent dot for thirty seconds reads as broken. Count up, and name what
  // is actually being waited on once it is clearly the model and not us.
  const thinking = bubble('tools', 'thinking… 0s')
  let secs = 0
  const tick = setInterval(() => {
    secs++
    thinking.textContent = secs < 6 ? `thinking… ${secs}s`
      : secs < 20 ? `asking Gemini… ${secs}s`
      : `Gemini is slow right now… ${secs}s`
  }, 1000)
  const stop = () => { clearInterval(tick); thinking.remove(); chat.splice(chat.indexOf(thinking), 1) }
  try {
    const res = await fetch('/api/chat', { method: 'POST', headers: headers(), body: JSON.stringify({ messages: history, date: logDate }) })
    if (res.status === 401) return gate('wrong passcode')
    const out = await res.json()
    stop()
    if (out.history) history = out.history
    if (out.needsKey) { bubble('err', out.error); return planScreen(me.user, out.error) }
    if (out.error) { bubble('err', out.error); if (out.proposal) proposalCard(out.proposal); return }
    if (out.calls?.length) bubble('tools', out.fast ? 'from your food table · instant' : out.calls.join(' → '))
    if (out.reply) bubble('msg bot', out.reply)
    if (out.proposal) proposalCard(out.proposal)
  } catch { stop(); bubble('err', 'network problem') }
}

/* ================================================================ chrome */
const VIEWS = { log: viewLog, trends: viewTrends, body: viewBody, insights: viewInsights }

// Free hosting sleeps after ~15 minutes idle; the first request after that
// can take up to a minute or drop entirely. One dropped request is not an
// outage, so a network failure retries a few times with a visible countdown
// before it is reported as a problem.
const RETRY_DELAYS = [3000, 6000, 12000]
async function render(attempt = 0) {
  try { await VIEWS[tab]() }
  catch (e) {
    if (String(e.message).includes('unauthorized')) return
    view.innerHTML = ''
    if (e.server) {
      return view.appendChild(el('card', `<h3>something broke</h3><p class="hint">${esc(e.message)}</p>
        ${/does not exist/.test(e.message) ? '<p class="hint" style="margin-top:8px">That looks like a database migration that has not been run: <code>npm run db:migrate</code></p>' : ''}`))
    }
    if (attempt < RETRY_DELAYS.length) {
      const wait = RETRY_DELAYS[attempt]
      const card = el('card', `<h3>waking the server up</h3><p class="hint">Free hosting sleeps when idle. Retrying in <b id="cd">${wait / 1000}</b>s…</p>`)
      view.appendChild(card)
      let left = wait / 1000
      const tick = setInterval(() => { left--; const c = card.querySelector('#cd'); if (c) c.textContent = left }, 1000)
      await new Promise((r) => setTimeout(r, wait))
      clearInterval(tick)
      return render(attempt + 1)
    }
    const card = el('card', `<h3>still can't reach the server</h3>
      <p class="hint">Tried ${RETRY_DELAYS.length + 1} times. Check your connection, then try again.</p>
      <div class="acts"><button class="b go" id="again">try again</button></div>`)
    card.querySelector('#again').onclick = () => render(0)
    view.appendChild(card)
  }
}
function switchTab(name) {
  tab = name
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === name))
  $('daybar').style.display = name === 'log' ? 'flex' : 'none'
  render()
}
document.querySelectorAll('nav button').forEach((b) => (b.onclick = () => switchTab(b.dataset.tab)))

function setDay(iso) {
  logDate = iso > isoToday() ? isoToday() : iso
  $('picker').value = logDate
  const past = logDate !== isoToday()

  $('next').disabled = !past
  chat = []; history = []
  render()

function wizard(steps, i = 0, dir = 'next') {
  document.body.innerHTML = `<div class="wiz">
    <div class="dots">${steps.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>
    <div class="pane in-${dir}" id="pane">${steps[i].html}</div></div>`
  const pane = document.getElementById('pane')
  steps[i].wire?.(pane, (k) => wizard(steps, k, k > i ? 'next' : 'back'))
}

const nextBtn = (label, id = 'nx') => `<button class="b go" id="${id}">${label}</button>`

function signInScreen(error) {
  const steps = [
    {
      html: `<img class="mark" src="/icon.svg" alt="">
        <h1>Tell it what you ate.<br>It counts <em>everything</em>.</h1>
        <p class="lead">Type a meal the way you would say it. No searching a list, no dropdowns.</p>
        <p class="lead">An agent works out the calories and protein, and remembers your food.</p>
        <p class="lead">Weigh in daily and it finds the calories you actually burn.</p>
        <div class="spacer"></div>
        <div class="cta">${nextBtn("Let's get fit")}</div>`,
      wire: (pane, go) => (pane.querySelector('#nx').onclick = () => go(1)),
    },
    {
      html: `<h1>How the agent <em>learns</em></h1>
        <div class="flow">
          <div class="ln"><span class="n">1</span><p>You type what you ate.<br>
            <span><code>200g rice and 3 boiled eggs</code></span></p></div>
          <div class="ln"><span class="n">2</span><p>The agent checks your own food list first.
            <span>If the dish is there, the numbers come straight from it.</span></p></div>
          <div class="ln"><span class="n">3</span><p>If it is new, Gemini reads your sentence
            <span>and works out what is in it.</span></p></div>
          <div class="ln"><span class="n">4</span><p>You confirm, and the dish joins your list.
            <span>Every number stays editable.</span></p></div>
        </div>
        <p class="flow tail">Next time you eat it, nothing is sent anywhere. It comes from your own
          list, with your portion. <b>That is how it learns your food.</b></p>
        <div class="spacer"></div>
        <div class="cta">${nextBtn('Next')}
          <button class="skip" id="bk">Back</button></div>`,
      wire: (pane, go) => {
        pane.querySelector('#nx').onclick = () => go(2)
        pane.querySelector('#bk').onclick = () => go(0)
      },
    },
    {
      html: `<h1>Your log stays <em>yours</em></h1>
        <p class="lead">Sign in so your food list, weight and targets belong to your account.
          Nobody else can see them.</p>
        <p class="lead">The agent learns your portions and your corrections, so that list has to be
          personal to you.</p>
        <p class="lead">Google sign-in means no password to invent, and none for this agent to store.
          It reads your name, email and picture. Nothing else.</p>
        ${error ? `<p class="err" style="margin-top:14px">${esc(error)}</p>` : ''}
        <div class="spacer"></div>
        <div class="cta">
          <a class="gsi" href="/api/auth/start">${GOOGLE_SVG}Continue with Google</a>
          <button class="skip" id="bk">Back</button>
          <p class="foot"><a href="/privacy.html">Privacy</a></p></div>`,
      wire: (pane, go) => (pane.querySelector('#bk').onclick = () => go(1)),
    },
  ]
  wizard(steps, error ? 2 : 0)
}

function planScreen(user, note) {
  const save = async (plan, key, btn) => {
    btn.disabled = true
    const r = await fetch('/api/auth/plan', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ plan, gemini_key: key }) })
    const out = await r.json()
    if (out.ok) location.href = '/'
    else { btn.disabled = false; planScreen(user, out.error) }
  }
  const steps = [
    {
      html: `<h1>One thing left: <em>a key</em></h1>
        <p class="lead">Reading your meals is done by Google's Gemini. An API key is simply a
          password that lets this agent ask Gemini on your behalf.</p>
        <p class="lead">Every new dish costs one call. Paid for by somebody.</p>
        <p class="lead">We would rather this agent stayed free. So bring your own key, and it is.
          Creating one takes two minutes and costs nothing.</p>
        <div class="spacer"></div>
        <div class="cta">${nextBtn('Get my free key')}
          <button class="skip" id="hosted">Use the agent's key instead</button></div>`,
      wire: (pane, go) => {
        pane.querySelector('#nx').onclick = () => go(1)
        pane.querySelector('#hosted').onclick = (e) => save('hosted', '', e.target)
      },
    },
    {
      html: `<h1>Paste your key</h1>
        <ol class="keysteps">
          <li>Open <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> and sign in with any Google account.</li>
          <li>Click <b>Create API key</b>, then copy the long string.</li>
          <li>Paste it below. Google's free tier covers normal daily use.</li>
        </ol>
        <input id="gkey" type="password" autocomplete="off" style="margin-top:16px" placeholder="${user.hasKey ? 'key saved, paste a new one to replace' : 'AIzaSy…'}">
        <p class="foot" style="text-align:left;margin-top:10px">Your key is encrypted before it is stored
          and never shown back, to you or anyone.</p>
        ${note ? `<p class="err" style="margin-top:12px">${esc(note)}</p>` : ''}
        <div class="spacer"></div>
        <div class="cta">${nextBtn('Start tracking', 'go')}
          <button class="skip" id="bk">Back</button></div>`,
      wire: (pane, go) => {
        const key = pane.querySelector('#gkey')
        pane.querySelector('#go').onclick = (e) => save('byok', key.value.trim(), e.target)
        key.addEventListener('keydown', (e) => { if (e.key === 'Enter') pane.querySelector('#go').click() })
        pane.querySelector('#bk').onclick = () => go(0)
      },
    },
  ]
  wizard(steps, note ? 1 : 0)
}
function passcodeScreen(message) {
  screen(`<h2>Calorie Counter</h2><p>${esc(message || 'enter the passcode')}</p>
    <input id="p" type="password" enterkeyhint="go" class="b" style="text-align:left;font-weight:400">
    <button class="b go" id="ok" style="width:100%;margin-top:8px">unlock</button>`)
  const go = () => { localStorage.setItem('passcode', $('p').value.trim()); location.reload() }
  $('ok').onclick = go
  $('p').addEventListener('keydown', (e) => { if (e.key === 'Enter') go() })
  $('p').focus()
}
const gate = (m) => (me?.auth ? signInScreen(m) : passcodeScreen(m))

  const b = $('acct')
  b.innerHTML = me?.signedIn && me.user.picture ? `<img src="${esc(me.user.picture)}" alt="">settings`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>settings`
  b.onclick = settingsScreen
}

async function boot() {
  const err = new URLSearchParams(location.search).get('error')
  if (err) history.replaceState({}, '', '/')
  try { me = await (await fetch('/api/auth/me')).json() } catch { me = { auth: false, single_user: true } }
  if (me.auth && !me.signedIn) {
    return signInScreen(err === 'auth_failed' ? 'Google sign-in failed. Try again.' : err === 'auth_state' ? 'That sign-in link expired. Try again.' : null)
  }
  if (me.signedIn && me.user.plan === 'byok' && !me.user.hasKey) return planScreen(me.user)
  accountButton()
  setDay(logDate)
}

$('send').onclick = send
// addEventListener, never onkeydown = (e) => cond && fn(): a false return value
// calls preventDefault and silently swallows every keystroke.
$('say').addEventListener('keydown', (e) => { if (e.key === 'Enter') send() })
boot()
if (!matchMedia('(pointer:coarse)').matches) $('say').focus()

if ('serviceWorker' in navigator) {
  if (location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {})
  else { navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())); caches?.keys().then((ks) => ks.forEach((k) => caches.delete(k))) }
}
