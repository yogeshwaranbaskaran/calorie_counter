<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1012">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>health agent</title>
<style>
:root{
  --bg:#0e1012; --surface:#17191d; --line:#24272c; --text:#e8eaed;
  --muted:#8b9199; --faint:#5c626a; --accent:#7dd88f; --danger:#e07a7a;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
header{
  display:flex; align-items:baseline; gap:9px; padding:13px 16px;
  border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; background:var(--bg);
}
header b{font-size:23px; font-variant-numeric:tabular-nums; line-height:1}
header .u{color:var(--muted); font-size:13px}
header .sp{margin-left:auto; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums}
main{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px}

/* ---- empty state: the app must say what it is and what to type ---- */
.intro{margin:auto 0; padding:8px 2px}
.intro h1{font-size:19px; margin:0 0 6px; font-weight:600}
.intro p{margin:0 0 18px; color:var(--muted); font-size:14px; max-width:34ch}
.intro small{display:block; color:var(--faint); font-size:12px; margin-bottom:9px; letter-spacing:.03em; text-transform:uppercase}
.eg{
  display:block; width:100%; text-align:left; margin-bottom:7px; padding:11px 13px;
  background:var(--surface); border:1px solid var(--line); border-radius:11px;
  color:var(--text); font:inherit; cursor:pointer;
}
.eg:active{border-color:var(--muted)}

/* ---- today's entries ---- */
.today{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:6px 4px}
.today h3{margin:6px 10px 4px; font-size:11px; color:var(--faint); font-weight:600; letter-spacing:.06em; text-transform:uppercase}
.ent{display:flex; align-items:center; gap:10px; padding:7px 10px; font-variant-numeric:tabular-nums}
.ent .n{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ent .k{color:var(--muted); font-size:13px}
.ent .x{
  background:none; border:0; color:var(--faint); font-size:17px; line-height:1;
  padding:2px 4px; cursor:pointer; flex:0 0 auto;
}
.ent .x:active{color:var(--danger)}

.msg{max-width:88%; padding:10px 13px; border-radius:var(--radius); white-space:pre-wrap; word-wrap:break-word}
.me{align-self:flex-end; background:#243043; border-bottom-right-radius:4px}
.bot{align-self:flex-start; background:var(--surface); border-bottom-left-radius:4px}
.tools{align-self:flex-start; color:var(--faint); font-size:12px; font-family:ui-monospace,monospace}
.err{align-self:flex-start; color:var(--danger); font-size:13px}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px}
.card h3{margin:0 0 10px; font-size:11px; color:var(--faint); font-weight:600; letter-spacing:.06em; text-transform:uppercase}
.row{display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-variant-numeric:tabular-nums}
.row span:last-child{color:var(--muted); white-space:nowrap; font-size:13px}
.tot{border-top:1px solid var(--line); margin-top:8px; padding-top:10px; font-weight:600}
.tot span:last-child{color:var(--text)}
.acts{display:flex; gap:8px; margin-top:13px}
button.b{
  flex:1; padding:11px; border-radius:10px; border:1px solid var(--line);
  background:transparent; color:var(--text); font-size:15px; font-weight:600; cursor:pointer; font-family:inherit;
}
button.go{background:var(--accent); color:#0e1012; border-color:var(--accent)}
button.b:disabled{opacity:.4}

footer{padding:10px 12px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); display:flex; gap:8px; background:var(--bg)}
input{
  flex:1; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
  background:var(--surface); color:var(--text); font-size:16px; font-family:inherit;
}
input::placeholder{color:var(--faint)}
input:focus{outline:none; border-color:var(--muted)}
#send{flex:0 0 auto; padding:11px 17px; font-size:17px}
.gate{margin:auto; text-align:center; padding:24px; max-width:300px}
</style>
</head>
<body>
<header>
  <b id="kcal">0</b><span class="u">kcal today</span>
  <span class="sp" id="protein"></span>
</header>
<main id="feed"></main>
<footer>
  <input id="say" placeholder="what did you eat?" autocomplete="off" enterkeyhint="send">
  <button class="b" id="send">→</button>
</footer>

<script type="module">
const $ = (id) => document.getElementById(id)
const feed = $('feed')
let history = []
let pass = localStorage.getItem('passcode') || ''

const headers = () => ({ 'content-type': 'application/json', 'x-passcode': pass })
const el = (cls, html) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; return d }
const esc = (s) => String(s).replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]))

function bubble(cls, text) {
  const d = document.createElement('div')
  d.className = cls
  d.textContent = text
  feed.appendChild(d)
  feed.scrollTop = feed.scrollHeight
  return d
}

const EXAMPLES = ['2 dosa and sambar', 'a bowl of curd rice', '2 eggs and 2 chapati']

// Shown when there is nothing to look at yet. An empty screen with a number on
// it tells you nothing - this says what the app is and gives you a first move.
function intro() {
  const box = el('intro', `
    <h1>What did you eat?</h1>
    <p>Type it however you'd say it. I work out the calories, you confirm, it's logged.</p>
    <small>try</small>` + EXAMPLES.map((e) => `<button class="eg">${esc(e)}</button>`).join(''))
  box.querySelectorAll('.eg').forEach((b) => (b.onclick = () => { $('say').value = b.textContent; send() }))
  return box
}

function todayPanel(rows) {
  const box = el('today', '<h3>today</h3>' + rows.map((r) => `
    <div class="ent" data-id="${r.id}">
      <span class="n">${r.qty} × ${esc(r.name)}</span>
      <span class="k">${r.kcal} kcal</span>
      <button class="x" title="remove">×</button>
    </div>`).join(''))
  box.querySelectorAll('.ent').forEach((row) => {
    row.querySelector('.x').onclick = async () => {
      row.style.opacity = .4
      const res = await fetch(`/api/entry?id=${row.dataset.id}`, { method: 'DELETE', headers: headers() })
      if (res.ok) refreshDay(); else row.style.opacity = 1
    }
  })
  return box
}

// The top of the feed always reflects the stored day; chat appends below it.
async function refreshDay() {
  try {
    const r = await fetch('/api/day', { headers: headers() })
    if (r.status === 401) return gate()
    const d = await r.json()
    $('kcal').textContent = d.totals.kcal || 0
    $('protein').textContent = d.totals.protein_g ? `${d.totals.protein_g}g protein` : ''

    feed.querySelector('.today')?.remove()
    feed.querySelector('.intro')?.remove()
    if (d.rows.length) feed.prepend(todayPanel(d.rows))
    else if (!feed.children.length) feed.appendChild(intro())
  } catch {}
}

function gate(message) {
  document.body.innerHTML = `<div class="gate"><h2>health agent</h2>
    <p style="color:#8b9199;font-size:14px">${message || 'enter the passcode'}</p>
    <input id="p" type="password" style="width:100%;margin:8px 0" enterkeyhint="go">
    <button class="b go" id="ok" style="width:100%">unlock</button></div>`
  const go = () => { localStorage.setItem('passcode', $('p').value.trim()); location.reload() }
  $('ok').onclick = go
  $('p').onkeydown = (e) => e.key === 'Enter' && go()
  $('p').focus()
}

// The confirm gate, in the UI. Nothing is written until "log it" is pressed,
// and it sends only names and quantities - the server recomputes every number.
function proposalCard(p) {
  const box = el('card',
    `<h3>${p.date}</h3>` +
    p.rows.map((r) => `<div class="row"><span>${r.qty} × ${esc(r.name)}</span><span>${r.grams}g · ${r.kcal} kcal</span></div>`).join('') +
    `<div class="row tot"><span>total</span><span>${p.totals.kcal} kcal · ${p.totals.protein_g}g protein</span></div>` +
    `<div class="acts"><button class="b" id="no">cancel</button><button class="b go" id="yes">log it</button></div>`)
  feed.appendChild(box)
  feed.scrollTop = feed.scrollHeight

  box.querySelector('#no').onclick = () => {
    box.querySelector('.acts').remove()
    bubble('tools', 'not logged')
    history.push({ role: 'user', text: '(I cancelled that - do not log it)' })
  }
  box.querySelector('#yes').onclick = async () => {
    box.querySelectorAll('button').forEach((b) => (b.disabled = true))
    const items = p.rows.map((r) => ({ name: r.name, qty: r.qty }))
    const res = await fetch('/api/commit', { method: 'POST', headers: headers(), body: JSON.stringify({ date: p.date, items }) })
    const out = await res.json()
    box.querySelector('.acts').remove()
    if (out.written) {
      bubble('tools', `logged · ${out.totals.kcal} kcal`)
      history.push({ role: 'user', text: '(confirmed and logged)' })
      refreshDay()
    } else bubble('err', out.error || 'could not save')
  }
}

async function send() {
  const text = $('say').value.trim()
  if (!text) return
  $('say').value = ''
  feed.querySelector('.intro')?.remove()
  bubble('msg me', text)
  history.push({ role: 'user', text })

  const thinking = bubble('tools', '…')
  try {
    const res = await fetch('/api/chat', { method: 'POST', headers: headers(), body: JSON.stringify({ messages: history }) })
    if (res.status === 401) return gate('wrong passcode')
    const out = await res.json()
    thinking.remove()

    // A rate-limited turn can still carry a finished proposal - show it, so a
    // 429 never costs you the meal you just typed.
    if (out.history) history = out.history
    if (out.error) {
      bubble('err', out.error)
      if (out.proposal) proposalCard(out.proposal)
      return
    }
    if (out.calls?.length) bubble('tools', out.calls.join(' → '))
    if (out.reply) bubble('msg bot', out.reply)
    if (out.proposal) proposalCard(out.proposal)
  } catch {
    thinking.remove()
    bubble('err', 'network problem')
  }
}

$('send').onclick = send
$('say').onkeydown = (e) => e.key === 'Enter' && send()
refreshDay()
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {})
</script>
</body>
</html>
