services:
  - type: web
    name: calorie_counter
    runtime: node
    plan: free
    # Next to the Neon database (ap-southeast-1). Without this Render defaults
    # to Oregon and every query crosses the Pacific.
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health   # /api/day needs the passcode and would 401
    envVars:
      - key: TZ
        value: Asia/Tokyo    # localDate() is the server's clock; UTC would date a 07:00 breakfast to yesterday
      - key: GEMINI_API_KEY
        sync: false          # set in the Render dashboard, never in git
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: DATABASE_URL
        sync: false          # Neon pooled connection string
      - key: APP_PASSCODE
        sync: false          # only used when Google sign-in is not configured
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false          # signs session cookies AND encrypts users' keys
      - key: OWNER_EMAIL
        sync: false          # this account adopts the pre-accounts data
      - key: API_TOKEN
        sync: false          # bearer token for the owner's own scripts (Suno)
